<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#7f1d1d">
<title>Vision Mechanical — Equipment Rentals</title>
<style>
:root{--vm:#c0392b;--vm2:#7f1d1d;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--bg:#f4f5f7;--ok:#15803d;--okbg:#dcfce7;--red:#b91c1c;--redbg:#fde8e8;--amb:#b45309;--ambbg:#fef3c7;--gry:#475569;--grybg:#eef2f7}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
header{background:linear-gradient(135deg,var(--vm),var(--vm2));color:#fff;padding:12px 14px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header .row{display:flex;align-items:center;gap:12px;max-width:1000px;margin:0 auto}
header img{height:36px;width:auto;background:#fff;border-radius:8px;padding:4px 6px}
header h1{margin:0;font-size:18px}header .who{font-size:12px;opacity:.9;margin-top:2px}
.wrap{max-width:1000px;margin:0 auto;padding:12px 12px 60px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;border-top:4px solid var(--gry)}
.tile .n{font-size:26px;font-weight:800}.tile .l{font-size:12px;color:var(--mut);font-weight:700}
.tile.red{border-top-color:var(--red)}.tile.red .n{color:var(--red)}
.tile.amb{border-top-color:var(--amb)}.tile.amb .n{color:var(--amb)}
.tile.ok{border-top-color:var(--ok)}.tile.ok .n{color:var(--ok)}
.tile.sel{outline:3px solid rgba(192,57,43,.35)}
.bar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:2fr 1fr auto auto;gap:8px;align-items:center}
input,select,textarea{width:100%;padding:11px;font-size:16px;border:1.5px solid #9ca3af;border-radius:9px;background:#f3f5f8;font-family:inherit;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--vm);background:#fff}
.btn{padding:11px 14px;border:none;border-radius:9px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}
.btn-p{background:var(--vm);color:#fff}.btn-g{background:#fff;color:var(--vm);border:1.5px solid var(--vm)}
.btn-d{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.emp{background:#fff;border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.emp h3{margin:0;padding:10px 14px;font-size:15px;background:#fafbfc;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.cert{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid #f1f2f4}
.cert:first-of-type{border-top:none}
.cert .m{flex:1;min-width:0}.cert .t{font-weight:800;font-size:14.5px}.cert .s{font-size:12.5px;color:var(--mut);margin-top:2px}
.pill{font-size:11.5px;font-weight:800;border-radius:12px;padding:3px 9px;white-space:nowrap}
.p-exp{background:var(--redbg);color:var(--red)}.p-soon{background:var(--ambbg);color:var(--amb)}.p-ok{background:var(--okbg);color:var(--ok)}.p-none{background:var(--grybg);color:var(--gry)}
.unv{font-size:11px;font-weight:800;color:var(--amb);margin-left:6px}
.cert a{color:var(--vm);font-weight:700;font-size:13px;text-decoration:none}
.cert .ed{border:none;background:none;color:var(--mut);font-size:18px;cursor:pointer;padding:4px 6px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:80;padding:16px;overflow:auto}
.modal .box{background:#fff;max-width:520px;margin:0 auto;border-radius:12px;padding:16px}
.modal h2{margin:0 0 6px;font-size:17px;color:var(--vm2)}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:12px;color:var(--mut);margin-top:3px}
.row-b{display:flex;gap:8px;margin-top:14px}.row-b .btn{flex:1}
.msg{padding:10px;border-radius:9px;font-size:14px;margin:8px 0;display:none}
.msg.ok{background:var(--okbg);color:var(--ok);display:block}.msg.err{background:var(--redbg);color:var(--red);display:block}.msg.info{background:var(--grybg);color:var(--gry);display:block}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;color:var(--ink);margin-top:10px}.chk input{width:20px;height:20px}
.prev{max-width:100%;max-height:160px;border-radius:8px;margin-top:6px;display:none}
.gate{position:fixed;inset:0;background:linear-gradient(135deg,var(--vm),var(--vm2));display:flex;align-items:center;justify-content:center;z-index:100;color:#fff;text-align:center;padding:24px}
.gate .box{max-width:340px}.gate img{height:74px;background:#fff;border-radius:12px;padding:8px 12px;margin-bottom:16px}
.gate h1{font-size:22px;margin:0 0 6px}.gate p{opacity:.9;font-size:14px;margin:0 0 20px}
.gate button{background:#fff;color:var(--vm2);border:none;border-radius:10px;padding:13px 22px;font-size:15px;font-weight:700;cursor:pointer}
@media(max-width:700px){.tiles{grid-template-columns:1fr 1fr}.bar{grid-template-columns:1fr 1fr}.bar #q{grid-column:1/-1}}
.cert .pills{display:flex;flex-direction:column;gap:4px;align-items:flex-end}.cert .pl{font-size:10.5px;color:var(--mut);font-weight:800;text-transform:uppercase;margin-right:4px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}}
.vtabs{display:none;gap:6px;margin:0 0 10px}.vtabs.on{display:flex}.vtabs a{flex:1;text-align:center;padding:10px;border-radius:10px;background:#fff;border:1.5px solid var(--line);color:var(--ink);font-weight:800;font-size:14px;text-decoration:none}.vtabs a.cur{background:var(--vm);border-color:var(--vm);color:#fff}
.st{font-size:11.5px;font-weight:800;border-radius:12px;padding:3px 9px;white-space:nowrap}
.s-req{background:var(--grybg);color:var(--gry)}.s-on{background:var(--okbg);color:var(--ok)}.s-co{background:var(--ambbg);color:var(--amb)}.s-off{background:#e0e7ff;color:#3730a3}.s-pu{background:#f1f5f9;color:#94a3b8}
.rent{background:#fff;border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:12px 14px;border-left:5px solid var(--line)}
.rent.od{border-color:#fca5a5;border-left-color:var(--red);background:#fff7f7}
.rent .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rent .t{font-weight:800;font-size:15px}.rent .s{font-size:12.5px;color:var(--mut);margin-top:3px;line-height:1.45}
.rent .od-b{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;margin-top:6px}
.rent .dor{font-size:12.5px;font-weight:800;color:var(--ink);margin-top:5px}.rent.od .dor{color:var(--red)}
.rent .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.rent .acts .btn{flex:1;min-width:120px;white-space:normal;line-height:1.2}
.btn-k{background:var(--amb);color:#fff}
.sec{margin-top:14px;padding-top:6px;border-top:2px solid var(--line)}.sec h4{margin:6px 0 0;font-size:13px;color:var(--vm2);text-transform:uppercase;letter-spacing:.03em}
.log{font-size:12.5px;color:var(--gry);background:var(--grybg);border-radius:8px;padding:8px 10px;white-space:pre-wrap;margin-top:4px}
.bar{grid-template-columns:2fr 1fr 1fr auto auto}
@media(max-width:700px){.bar{grid-template-columns:1fr 1fr}.bar #q{grid-column:1/-1}.bar #addBtn{grid-column:1/-1}}
input:disabled,select:disabled,textarea:disabled{opacity:1;color:var(--ink);background:#fafafa;border-color:var(--line)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.4/lib/msal-browser.min.js"></script>
<script src="/roles.js"></script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/favicon-32.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<div id="gate" class="gate"><div class="box">
  <img src="https://img1.wsimg.com/isteam/ip/758c2db3-5548-4484-9c69-07d1b4315f5e/logo%20main%20jpg.jpg/:/rs=h:140,m/qt=q:92" alt="Vision Mechanical">
  <h1>Equipment Rentals</h1><p>Request lifts, telehandlers, generators and heaters for your job — and call them off the day you're done. Sign in with your Vision Mechanical account.</p>
  <button id="signin">Sign in with Microsoft</button><div id="gateMsg" style="margin-top:14px;font-size:13px"></div>
</div></div>
<header><div class="row">
  <img src="https://img1.wsimg.com/isteam/ip/758c2db3-5548-4484-9c69-07d1b4315f5e/logo%20main%20jpg.jpg/:/rs=h:96,m/qt=q:92" alt="Vision Mechanical">
  <div><h1>Equipment Rentals</h1><div class="who" id="who"></div></div>
</div></header>
<div class="wrap" id="app" style="display:none">
  <div class="msg info" id="topMsg"></div>
  <div class="tiles" id="tiles"></div>
  <div class="bar" id="bar">
    <input type="text" id="q" placeholder="Search equipment, vendor, unit #, contract…">
    <select id="fjob"><option value="">All jobs</option></select>
    <select id="fstat"></select>
    <button class="btn btn-g" id="csvBtn">CSV</button>
    <button class="btn btn-p" id="addBtn">+ Request rental</button>
  </div>
  <div id="list"></div>
</div>

<div class="modal" id="modal"><div class="box">
  <h2 id="mTitle">Request rental</h2>
  <div class="hint" id="mSub"></div>
  <label>Equipment</label><input type="text" id="fTitle" placeholder="e.g. 19' scissor lift, electric">
  <div class="grid2">
    <div><label>Category</label><select id="fCat"></select></div>
    <div><label>Job</label><select id="fJob"><option value="">Loading jobs…</option></select></div>
  </div>
  <label>Location on site</label><input type="text" id="fLoc" placeholder="e.g. Bldg 115, mech room east side">
  <div class="grid2">
    <div><label>Date needed</label><input type="date" id="fNeed"></div>
    <div><label>Planned off-rent date</label><input type="date" id="fPlan"></div>
  </div>
  <label>Notes</label><textarea id="fNotes" rows="2" placeholder="Optional — e.g. needs non-marking tires, 480V hookup"></textarea>
  <div class="sec" id="offSec">
    <h4>Office</h4>
    <div class="grid2">
      <div><label>Vendor</label><input type="text" id="fVendor" list="vendlist" placeholder="e.g. Sunbelt"><datalist id="vendlist"></datalist></div>
      <div><label>Contract / PO #</label><input type="text" id="fContract"></div>
    </div>
    <div class="grid2">
      <div><label>Unit # / serial</label><input type="text" id="fUnit"></div>
      <div><label>On-rent date</label><input type="date" id="fOnRent"></div>
    </div>
    <div class="grid2" id="rateRow">
      <div><label>Rate ($)</label><input type="text" id="fRate" inputmode="decimal" placeholder="e.g. 425"></div>
      <div><label>Rate cycle</label><select id="fCycle"><option value="">—</option><option>Day</option><option>Week</option><option>4-week</option></select></div>
    </div>
    <div class="grid2">
      <div><label>Call-off #</label><input type="text" id="fCallNo"></div>
      <div><label>Call-off date</label><input type="date" id="fCallDate"></div>
    </div>
    <div class="grid2">
      <div><label>Picked-up date</label><input type="date" id="fPick"></div>
      <div><label>Status</label><select id="fStatus"></select></div>
    </div>
  </div>
  <div id="logWrap" style="display:none"><label>History</label><div class="log" id="fLog"></div></div>
  <div class="msg" id="mMsg"></div>
  <div class="row-b"><button class="btn btn-g" id="mCancel">Cancel</button><button class="btn btn-p" id="mSave">Save</button></div>
  <div class="row-b" id="delRow" style="display:none"><button class="btn btn-d" id="mDel">Delete this rental</button></div>
</div></div>

<script>
var SCOPE="https://graph.microsoft.com/Sites.ReadWrite.All";
var SITE="visionmech.sharepoint.com,ccfe4256-b2bf-4a3b-8e37-50f8021bb3b2,acce7714-1643-4364-86e0-8641745e0281";
var SITEURL="https://graph.microsoft.com/v1.0/sites/"+SITE, GRAPH=SITEURL+"/lists/";
var LIST_NAME="Equipment Rentals", EMP="537b8d9b-e666-43d1-9441-efc2bed48d73", JOBTASKS="192b6fd5-5a12-47c1-9d1b-ba4b51e13371", JOBS="836523ba-cd20-4736-98ce-5716668b8973";
var VM_SUPER=VMR.owners.slice();
var VM_PMS=VMR.pms.slice();
var CATS=["Scissor lift","Boom lift","Telehandler","Forklift","Mini excavator / skid steer","Generator","Heater","Light tower","Welder","Trailer / other"];
var S_REQ="Requested", S_ON="On rent", S_CO="Call off requested", S_OFF="Off rent called", S_PU="Picked up";
var STATUSES=[S_REQ,S_ON,S_CO,S_OFF,S_PU], SCLS={"Requested":"s-req","On rent":"s-on","Call off requested":"s-co","Off rent called":"s-off","Picked up":"s-pu"};
var SELECT="Title,Category,Vendor,ContractNo,UnitNo,JobNo,JobName,Location,RequestedBy,LoginEmail,NeededDate,OnRentDate,PlannedOffDate,CallOffDate,CallOffNo,PickedUpDate,Status,Rate,RateCycle,Notes,StatusLog,Modified,Created";
var msalApp=new msal.PublicClientApplication({auth:{clientId:"ece3c8e3-0f54-49dc-bf83-b46411ade0aa",authority:"https://login.microsoftonline.com/8d64d0b9-91ba-4959-a83c-2e7e8cf233b3",redirectUri:(window.location.origin+window.location.pathname)},cache:{cacheLocation:"localStorage"}});
var account=null, loginEmail="", MY_NAME="", IS_ADMIN=false, IS_PM=false, OFFICE=false, LIST_ID=null, LIST_COLS=null, ROWS=[], EDIT=null, TILE="", JOBLIST=[];

function E(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pad(n){return (n<10?"0":"")+n;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parse(s){ s=String(s||"").slice(0,10); if(!/^\d{4}-\d\d-\d\d$/.test(s)) return null; var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function today0(){ var t=new Date(); t.setHours(0,0,0,0); return t; }
function daysSince(s){ var d=parse(s); if(!d) return null; return Math.round((today0()-d)/864e5); }
function nice(s){ var d=parse(s); return d?d.toLocaleDateString([], {month:"short",day:"numeric"}):""; }
function d10(v){ return String(v||"").slice(0,10); }
function dt(v){ return v?v+"T12:00:00Z":null; }
function autoEmail(n){var p=String(n||"").trim().split(/\s+/).filter(Boolean);if(!p.length)return "";var fi=(p[0][0]||"").toLowerCase(),ln=p[p.length-1].toLowerCase().replace(/[^a-z0-9]/g,"");return (fi&&ln)?(fi+ln+"@visionmech.net"):"";}
function yes(v){ return v===true||v==="Yes"||v==="true"; }
async function getToken(){ try{ return (await msalApp.acquireTokenSilent({scopes:[SCOPE],account:account})).accessToken; }catch(e){ msalApp.acquireTokenRedirect({scopes:[SCOPE]}); throw e; } }
async function gfetch(url,opt){ opt=opt||{}; var t=await getToken(); opt.headers=Object.assign({Authorization:"Bearer "+t},opt.headers||{}); var r=await fetch(url,opt); if(!r.ok&&r.status!==204){ var tx=await r.text(); throw new Error("HTTP "+r.status+" "+tx.slice(0,140)); } return r.status===204?null:r.json(); }
async function pullAll(listId,select){ var url=GRAPH+listId+"/items?$expand=fields($select="+select+")&$top=999", out=[]; while(url){ var j=await gfetch(url); (j.value||[]).forEach(function(it){ if(it.fields){ it.fields._id=it.id; out.push(it.fields);} }); url=j["@odata.nextLink"]||null; } return out; }
function onlyCols(f){ Object.keys(f).forEach(function(k){ if(k!=="Title"&&!LIST_COLS[k]) delete f[k]; }); return f; }
function stamp(){ var d=new Date(); return iso(d)+" "+pad(d.getHours())+":"+pad(d.getMinutes()); }
function logLine(status){ return stamp()+" · "+status+" · "+(MY_NAME||loginEmail); }
function addLog(prev,status){ prev=String(prev||"").trim(); return (prev?prev+"\n":"")+logLine(status); }

E("signin").onclick=function(){ msalApp.loginRedirect({scopes:[SCOPE]}); };
msalApp.handleRedirectPromise().then(function(r){ var all=msalApp.getAllAccounts(); var a=r&&r.account?r.account:(msalApp.getActiveAccount()||all.filter(function(x){return /@visionmech\.net$/i.test(x.username||"");})[0]||all[0]||null); if(a) start(a); }).catch(function(e){ E("gateMsg").textContent="Sign-in error: "+e.message; });

async function start(a){
  account=a; msalApp.setActiveAccount(a); loginEmail=(a.username||"").toLowerCase();
  E("gate").style.display="none"; E("who").textContent=a.name||a.username; E("app").style.display="block";
  E("fCat").innerHTML=CATS.map(function(t){return '<option>'+esc(t)+'</option>';}).join("");
  E("fStatus").innerHTML=STATUSES.map(function(t){return '<option>'+esc(t)+'</option>';}).join("");
  E("fstat").innerHTML='<option value="open">Open (not picked up)</option>'+STATUSES.map(function(t){return '<option>'+esc(t)+'</option>';}).join("")+'<option value="all">All, incl. picked up</option>';
  try{
    var emps=await pullAll(EMP,"EmployeeName,LoginEmail,Admin,Active");
    emps.forEach(function(f){ if(!f.EmployeeName) return; var n=String(f.EmployeeName).trim(), e=(f.LoginEmail||"").toLowerCase().trim()||autoEmail(n);
      if(e===loginEmail){ MY_NAME=n; if(yes(f.Admin)&&(f.Active||"Yes")!=="No") IS_ADMIN=true; } });
  }catch(e){}
  if(!MY_NAME) MY_NAME=a.name||a.username;
  if(VM_SUPER.indexOf(loginEmail)>-1) IS_ADMIN=true;
  if(VM_PMS.indexOf(loginEmail)>-1) IS_PM=true;
  OFFICE=IS_ADMIN||IS_PM;
  if(!OFFICE){ E("offSec").remove(); E("csvBtn").style.display="none"; }   /* rate + office fields never reach the page for field users */
  try{
    var tasks=await pullAll(JOBTASKS,"JobNo,JobName,Active"), seen={}, jobs=[];
    tasks.forEach(function(t){ if((t.Active||"Yes")==="No") return; var no=String(t.JobNo||"").trim(); if(!no||seen[no]) return; seen[no]=1; jobs.push({no:no,name:String(t.JobName||"").trim()}); });
    try{ var jl=await pullAll(JOBS,"Title,Archive"), arch={}; jl.forEach(function(j){ if(j.Archive===true||j.Archive==="Yes") arch[String(j.Title).trim()]=1; }); jobs=jobs.filter(function(j){return !arch[j.no];}); }catch(e){}
    jobs.sort(function(x,y){ return (x.name||x.no).toLowerCase().localeCompare((y.name||y.no).toLowerCase()); });
    JOBLIST=jobs; fillJobSelect("");
  }catch(e){ E("fJob").innerHTML='<option value="">Couldn\'t load jobs</option>'; }
  try{
    var lists=await gfetch(SITEURL+"/lists?$select=id,displayName&$top=999");
    var L=(lists.value||[]).filter(function(l){return (l.displayName||"").toLowerCase()===LIST_NAME.toLowerCase();})[0];
    if(!L){ E("topMsg").textContent="The “"+LIST_NAME+"” list isn't set up in SharePoint yet."; E("bar").style.display="none"; return; }
    LIST_ID=L.id; var c=await gfetch(GRAPH+LIST_ID+"/columns?$select=name,readOnly"); LIST_COLS={}; (c.value||[]).forEach(function(x){ if(!x.readOnly) LIST_COLS[x.name]=1; });
  }catch(e){ E("topMsg").textContent="Couldn't load ("+e.message+")."; return; }
  E("topMsg").textContent=OFFICE?"Office view — set units on rent, enter call-off numbers and pickups. Red = costing money past its planned off-rent date or waiting on a call-off.":"Need equipment? Tap + Request rental. Done with it? Tap “Ready for pickup — call it off” the same day so we stop paying rent.";
  ["q","fjob","fstat"].forEach(function(id){ E(id).addEventListener("input",render); E(id).addEventListener("change",render); });
  await load();
}
function fillJobSelect(cur){
  var has=JOBLIST.some(function(j){return j.no===cur;}), opts=JOBLIST.slice();
  if(cur&&!has&&EDIT) opts.push({no:cur,name:EDIT.JobName||""});
  E("fJob").innerHTML='<option value="">— Pick the job —</option>'+opts.map(function(j){return '<option value="'+esc(j.no)+'" data-name="'+esc(j.name)+'">'+esc(j.no+" "+j.name)+'</option>';}).join("");
  E("fJob").value=cur||"";
  if(window.vmJobScan) window.vmJobScan();
}
async function load(){
  try{ ROWS=await pullAll(LIST_ID,SELECT); }
  catch(e){ E("list").innerHTML='<div class="empty">Couldn\'t load rentals ('+esc(e.message)+').</div>'; return; }
  var jobs={}, vends={};
  ROWS.forEach(function(r){ if(r.JobNo) jobs[r.JobNo]=r.JobName||jobs[r.JobNo]||""; if(r.Vendor) vends[String(r.Vendor).trim()]=1; });
  var fj=E("fjob").value;
  E("fjob").innerHTML='<option value="">All jobs</option>'+Object.keys(jobs).map(function(k){return {no:k,name:jobs[k]};}).sort(function(x,y){return (x.name||x.no).localeCompare(y.name||y.no);})
    .map(function(j){return '<option value="'+esc(j.no)+'">'+esc(j.no+" "+j.name)+'</option>';}).join("");
  E("fjob").value=fj; if(E("fjob").value!==fj) E("fjob").value="";
  if(E("vendlist")) E("vendlist").innerHTML=Object.keys(vends).sort().map(function(v){return '<option value="'+esc(v)+'">';}).join("");
  render();
}
function st(r){ return STATUSES.indexOf(r.Status)>-1?r.Status:S_REQ; }
/* date the field asked for the call-off: last "Call off requested" line in StatusLog, else Modified */
function callOffAsked(r){ var lines=String(r.StatusLog||"").split(/\n/), d=null;
  lines.forEach(function(l){ if(l.indexOf(" · "+S_CO+" · ")>-1){ var m=/^(\d{4}-\d\d-\d\d)/.exec(l.trim()); if(m) d=m[1]; } });
  return d||d10(r.Modified); }
function overdue(r){ var s=st(r);
  if(s===S_ON){ var p=daysSince(r.PlannedOffDate); return p!==null&&p>0; }
  if(s===S_CO&&!String(r.CallOffNo||"").trim()){ var c=daysSince(callOffAsked(r)); return c!==null&&c>1; }
  return false; }
function why(r){ var s=st(r);
  if(s===S_ON){ var p=daysSince(r.PlannedOffDate); return "OVERDUE — planned off-rent "+nice(r.PlannedOffDate)+" ("+p+" day"+(p===1?"":"s")+" ago)"; }
  var c=daysSince(callOffAsked(r)); return "OVERDUE — pickup asked "+c+" days ago, no call-off # yet"; }
function stillOnRent(r){ var s=st(r); return s===S_ON||s===S_CO; }
function render(){
  var c={req:0,on:0,co:0,od:0};
  ROWS.forEach(function(r){ var s=st(r); if(s===S_REQ) c.req++; if(s===S_ON) c.on++; if(s===S_CO) c.co++; if(overdue(r)) c.od++; });
  var T=[["req","",S_REQ,c.req],["on","ok",S_ON,c.on],["co","amb",S_CO,c.co],["od","red","Overdue",c.od]];
  E("tiles").innerHTML=T.map(function(t){ return '<div class="tile '+t[1]+(TILE===t[0]?" sel":"")+'" data-t="'+t[0]+'"><div class="n">'+t[3]+'</div><div class="l">'+t[2]+'</div></div>'; }).join("");
  E("tiles").querySelectorAll(".tile").forEach(function(el){ el.onclick=function(){ var t=el.getAttribute("data-t"); TILE=(TILE===t)?"":t; render(); }; });
  var q=E("q").value.toLowerCase().trim(), fj=E("fjob").value, fs=E("fstat").value;
  var TS={req:S_REQ,on:S_ON,co:S_CO};
  var rows=ROWS.filter(function(r){ var s=st(r);
    if(fj&&r.JobNo!==fj) return false;
    if(TILE==="od"){ if(!overdue(r)) return false; } else if(TILE){ if(s!==TS[TILE]) return false; }
    else if(fs==="open"){ if(s===S_PU) return false; } else if(fs!=="all"&&fs&&s!==fs) return false;
    if(q&&[r.Title,r.Category,r.Vendor,r.ContractNo,r.UnitNo,r.JobNo,r.JobName,r.Location,r.RequestedBy,r.CallOffNo,r.Notes].join(" ").toLowerCase().indexOf(q)<0) return false; return true; })
    .sort(function(a,b){ var oa=overdue(a)?0:1, ob=overdue(b)?0:1; if(oa!==ob) return oa-ob;
      var ia=STATUSES.indexOf(st(a)), ib=STATUSES.indexOf(st(b)); var ra=[2,1,0,3,4][ia], rb=[2,1,0,3,4][ib]; if(ra!==rb) return ra-rb;
      return String(a.NeededDate||a.Created||"").localeCompare(String(b.NeededDate||b.Created||"")); });
  if(!rows.length){ E("list").innerHTML='<div class="empty">'+(ROWS.length?"Nothing matches.":"No rentals yet. Tap + Request rental when you need equipment on a job.")+'</div>'; return; }
  E("list").innerHTML=rows.map(function(r){ var s=st(r), od=overdue(r), sub=[], acts=[];
    sub.push(esc(r.Category||""));
    if(r.JobNo) sub.push(esc((r.JobName?r.JobName+" · ":"")+r.JobNo));
    if(r.Location) sub.push("&#128205; "+esc(r.Location));
    var l2=[];
    if(s===S_REQ&&r.NeededDate) l2.push("Needed "+nice(r.NeededDate));
    if(r.PlannedOffDate&&s!==S_PU) l2.push("Planned off "+nice(r.PlannedOffDate));
    if(r.Vendor) l2.push(esc(r.Vendor)+(r.UnitNo?" #"+esc(r.UnitNo):""));
    else if(r.UnitNo) l2.push("Unit "+esc(r.UnitNo));
    if(OFFICE&&r.ContractNo) l2.push("Contract "+esc(r.ContractNo));
    if(OFFICE&&r.Rate) l2.push("$"+esc(r.Rate)+(r.RateCycle?" / "+esc(r.RateCycle):""));
    if(r.CallOffNo) l2.push("Call-off #"+esc(r.CallOffNo)+(r.CallOffDate?" "+nice(r.CallOffDate):""));
    if(s===S_PU&&r.PickedUpDate) l2.push("Picked up "+nice(r.PickedUpDate));
    if(r.RequestedBy) l2.push("by "+esc(r.RequestedBy));
    var dor="";
    if(stillOnRent(r)&&r.OnRentDate){ var n=daysSince(r.OnRentDate); if(n!==null&&n>=0) dor='<div class="dor">'+n+' day'+(n===1?"":"s")+' on rent (since '+nice(r.OnRentDate)+')</div>'; }
    var id=esc(r._id);
    if(s===S_ON) acts.push('<button class="btn btn-k" data-act="ready" data-id="'+id+'">Ready for pickup — call it off</button>');
    if(OFFICE){
      if(s===S_REQ) acts.push('<button class="btn btn-p" data-act="'+S_ON+'" data-id="'+id+'">Set on rent</button>');
      if(s===S_ON||s===S_CO) acts.push('<button class="btn btn-p" data-act="'+S_OFF+'" data-id="'+id+'">Enter call-off #</button>');
      if(s===S_OFF) acts.push('<button class="btn btn-p" data-act="'+S_PU+'" data-id="'+id+'">Picked up</button>');
    }
    acts.push('<button class="btn btn-g" data-act="open" data-id="'+id+'" style="flex:0 0 auto;min-width:0">'+((OFFICE||(s===S_REQ&&mine(r)))?"Edit":"Details")+'</button>');
    return '<div class="rent'+(od?" od":"")+'"><div class="top"><div class="t">'+esc(r.Title||"(no description)")+'</div><span class="st '+SCLS[s]+'">'+esc(s)+'</span></div>'+
      '<div class="s">'+sub.filter(Boolean).join(" · ")+(l2.length?'<br>'+l2.join(" · "):"")+'</div>'+dor+
      (od?'<div class="od-b">'+esc(why(r))+'</div>':'')+'<div class="acts">'+acts.join("")+'</div></div>'; }).join("");
  E("list").querySelectorAll("button[data-act]").forEach(function(b){ b.onclick=function(){ var r=byId(b.getAttribute("data-id")), a=b.getAttribute("data-act"); if(!r) return;
    if(a==="ready") readyForPickup(r, b); else if(a==="open") openForm(r,null); else openForm(r,a); }; });
}
function byId(id){ return ROWS.filter(function(r){return r._id===id;})[0]; }
function mine(r){ return String(r.LoginEmail||"").toLowerCase()===loginEmail; }
async function patch(id,f){ return gfetch(GRAPH+LIST_ID+"/items/"+id+"/fields",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(onlyCols(f))}); }
async function readyForPickup(r,btn){
  if(!confirm("Call off "+(r.Title||"this rental")+"?\n\nThe office will call the vendor for pickup. Make sure it's parked, charged/fueled and ready to go.")) return;
  btn.disabled=true; btn.textContent="Sending…";
  try{ await patch(r._id,{Status:S_CO,StatusLog:addLog(r.StatusLog,S_CO)}); await load(); }
  catch(e){ btn.disabled=false; btn.textContent="Ready for pickup — call it off"; alert("Couldn't send ("+e.message+")."); }
}

/* ===== request / edit / office step ===== */
var REQ_IDS=["fTitle","fCat","fJob","fLoc","fNeed","fPlan","fNotes"];
function openForm(r,step){
  EDIT=r||null; E("mMsg").className="msg";
  var s=r?st(r):S_REQ, canReq=!r||OFFICE||(s===S_REQ&&mine(r));
  E("mTitle").textContent=!r?"Request rental":step===S_ON?"Set on rent":step===S_OFF?"Enter call-off":step===S_PU?"Mark picked up":(canReq?"Edit rental":"Rental details");
  E("mSub").textContent=r?((r.Title||"")+(r.RequestedBy?" — requested by "+r.RequestedBy:"")):"The office will book it and fill in vendor and unit #.";
  E("fTitle").value=r?(r.Title||""):""; E("fCat").value=(r&&CATS.indexOf(r.Category)>-1)?r.Category:CATS[0];
  fillJobSelect(r?(r.JobNo||""):"");
  E("fLoc").value=r?(r.Location||""):""; E("fNeed").value=r?d10(r.NeededDate):""; E("fPlan").value=r?d10(r.PlannedOffDate):""; E("fNotes").value=r?(r.Notes||""):"";
  REQ_IDS.forEach(function(id){ E(id).disabled=!canReq; });
  if(OFFICE){
    var t=iso(new Date());
    E("fVendor").value=r?(r.Vendor||""):""; E("fContract").value=r?(r.ContractNo||""):""; E("fUnit").value=r?(r.UnitNo||""):"";
    E("fOnRent").value=r?d10(r.OnRentDate):""; E("fRate").value=r?(r.Rate||""):""; E("fCycle").value=r?(r.RateCycle||""):"";
    E("fCallNo").value=r?(r.CallOffNo||""):""; E("fCallDate").value=r?d10(r.CallOffDate):""; E("fPick").value=r?d10(r.PickedUpDate):"";
    E("fStatus").value=step||s;
    if(step===S_ON&&!E("fOnRent").value) E("fOnRent").value=t;
    if(step===S_OFF&&!E("fCallDate").value) E("fCallDate").value=t;
    if(step===S_PU&&!E("fPick").value) E("fPick").value=t;
  }
  E("logWrap").style.display=(r&&r.StatusLog)?"block":"none"; E("fLog").textContent=r?(r.StatusLog||""):"";
  E("mSave").style.display=canReq?"":"none"; E("mCancel").textContent=canReq?"Cancel":"Close";
  E("mSave").textContent=!r?"Send request":step?("Save — "+step):"Save";
  E("delRow").style.display=(r&&(OFFICE||(s===S_REQ&&mine(r))))?"flex":"none";
  E("modal").style.display="block"; E("modal").scrollTop=0;
  var focus=step===S_ON?"fVendor":step===S_OFF?"fCallNo":null; if(focus) setTimeout(function(){ try{E(focus).focus();}catch(e){} },50);
}
E("addBtn").onclick=function(){ openForm(null,null); };
E("mCancel").onclick=function(){ E("modal").style.display="none"; };
E("mSave").onclick=async function(){
  var m=E("mMsg"), miss=[], title=E("fTitle").value.trim(), job=E("fJob").value, need=E("fNeed").value, plan=E("fPlan").value;
  if(!title) miss.push("Equipment"); if(!job) miss.push("Job"); if(!need) miss.push("Date needed");
  if(need&&plan&&plan<need) miss.push("Planned off-rent is before the date needed");
  var ns=EDIT?st(EDIT):S_REQ;
  if(OFFICE){ ns=E("fStatus").value;
    var onr=E("fOnRent").value, cn=E("fCallNo").value.trim(), cd=E("fCallDate").value, pu=E("fPick").value;
    if(ns!==S_REQ){ if(!E("fVendor").value.trim()) miss.push("Vendor"); if(!onr) miss.push("On-rent date"); }
    if(ns===S_OFF||ns===S_PU){ if(!cn) miss.push("Call-off #"); if(!cd) miss.push("Call-off date"); }
    if(ns===S_PU&&!pu) miss.push("Picked-up date");
    if(E("fRate").value.trim()&&!/^\$?\s*[\d,]+(\.\d+)?$/.test(E("fRate").value.trim())) miss.push("Rate should be a number");
  }
  if(miss.length){ m.className="msg err"; m.textContent="Still needed: "+miss.join(", ")+"."; return; }
  E("mSave").disabled=true; m.className="msg info"; m.textContent="Saving…";
  try{
    var opt=E("fJob").options[E("fJob").selectedIndex];
    var f={ Title:title, Category:E("fCat").value, JobNo:job, JobName:opt?(opt.getAttribute("data-name")||""):"", Location:E("fLoc").value.trim(),
      NeededDate:dt(need), PlannedOffDate:dt(plan), Notes:E("fNotes").value.trim() };
    if(OFFICE){ Object.assign(f,{ Vendor:E("fVendor").value.trim(), ContractNo:E("fContract").value.trim(), UnitNo:E("fUnit").value.trim(),
      OnRentDate:dt(E("fOnRent").value), Rate:E("fRate").value.trim().replace(/[$\s,]/g,""), RateCycle:E("fCycle").value,
      CallOffNo:E("fCallNo").value.trim(), CallOffDate:dt(E("fCallDate").value), PickedUpDate:dt(E("fPick").value), Status:ns }); }
    if(!EDIT){
      Object.assign(f,{ Status:ns, RequestedBy:MY_NAME, LoginEmail:loginEmail, StatusLog:addLog("",S_REQ)+(ns!==S_REQ?"\n"+logLine(ns):"") });
      onlyCols(f); Object.keys(f).forEach(function(k){ if(f[k]===null||f[k]==="") delete f[k]; });
      await gfetch(GRAPH+LIST_ID+"/items",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:f})});
    } else {
      if(ns!==st(EDIT)) f.StatusLog=addLog(EDIT.StatusLog,ns);
      await patch(EDIT._id,f);
    }
    E("modal").style.display="none"; await load();
  }catch(e){ m.className="msg err"; m.textContent="Couldn't save ("+e.message+")."; }
  E("mSave").disabled=false;
};
E("mDel").onclick=async function(){ if(!EDIT||!confirm("Delete "+(EDIT.Title||"this rental")+"?\n\nIf it was on rent, mark it Picked up instead to keep the history.")) return;
  try{ await gfetch(GRAPH+LIST_ID+"/items/"+EDIT._id,{method:"DELETE"}); E("modal").style.display="none"; await load(); }catch(e){ E("mMsg").className="msg err"; E("mMsg").textContent="Couldn't delete ("+e.message+")."; } };
E("csvBtn").onclick=function(){ if(!OFFICE) return;
  var head=["Equipment","Category","Status","Overdue","Job #","Job name","Location","Requested by","Needed","Planned off-rent","Vendor","Contract/PO #","Unit #/serial","On-rent date","Days on rent","Rate","Rate cycle","Call-off #","Call-off date","Picked up","Notes","Status log"];
  var lines=[head].concat(ROWS.map(function(r){ var end=r.PickedUpDate||r.CallOffDate, dor="";
      if(r.OnRentDate){ var a=parse(r.OnRentDate), b=end?parse(end):today0(); if(a&&b) dor=Math.max(0,Math.round((b-a)/864e5)); }
      return [r.Title,r.Category,st(r),overdue(r)?"Yes":"",r.JobNo,r.JobName,r.Location,r.RequestedBy,d10(r.NeededDate),d10(r.PlannedOffDate),r.Vendor,r.ContractNo,r.UnitNo,d10(r.OnRentDate),dor,r.Rate,r.RateCycle,r.CallOffNo,d10(r.CallOffDate),d10(r.PickedUpDate),r.Notes,r.StatusLog]; }))
    .map(function(a){ return a.map(function(v){ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(","); }).join("\r\n");
  var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([lines],{type:"text/csv"})); a.download="rentals-"+iso(new Date())+".csv"; a.click(); };
</script>
<script>
/* ===== Job lists show NAME first, A–Z (e.g. "Epic Phase II · A26103") =====
   Works on any <select> or <datalist> whose options are jobs. Values the page saves are unchanged:
   a picked datalist entry is turned back into "A26103 Epic Phase II" before the page reads it. */
(function(){
  var NO="[A-Z]?\\d{2}[A-Z]?-?\\d{3,}";
  var FWD=new RegExp("^("+NO+")(?:\\s*·\\s*|\\s+)(.+)$"), REV=new RegExp("^(.+?)\\s+·\\s+("+NO+")$");
  function fl(t){ var m=FWD.exec(String(t||"").trim()); return m?{no:m[1],name:m[2].trim()}:null; }
  function cmp(a,b){ return a.k.localeCompare(b.k,undefined,{sensitivity:"base",numeric:true}); }
  function doSelect(sel){
    var opts=Array.prototype.slice.call(sel.options), real=opts.filter(function(o){return o.value!=="";});
    var jobs=real.filter(function(o){ return o.getAttribute("data-vmflip")||fl(o.textContent); });
    if(jobs.length<2||jobs.length<real.length*0.6) return;
    if(jobs.every(function(o){return o.getAttribute("data-vmflip");})) return;
    var v=sel.value;
    jobs.forEach(function(o){ if(o.getAttribute("data-vmflip")) return; if(!o.hasAttribute("value")) o.setAttribute("value",o.textContent); var f=fl(o.textContent); o.textContent=f.name+" · "+f.no; o.setAttribute("data-vmflip","1"); });
    var items=jobs.map(function(o){return {o:o,k:o.textContent.toLowerCase()};}).sort(cmp);
    items.forEach(function(it){ sel.appendChild(it.o); });
    opts.filter(function(o){return jobs.indexOf(o)<0&&o.value!=="";}).forEach(function(o){ sel.appendChild(o); });
    sel.value=v;
  }
  function doList(dl){
    var opts=Array.prototype.slice.call(dl.options), jobs=opts.filter(function(o){ return o.getAttribute("data-vmorig")||fl(o.value); });
    if(jobs.length<2||jobs.length<opts.length*0.6) return;
    if(jobs.every(function(o){return o.getAttribute("data-vmorig");})) return;
    jobs.forEach(function(o){ if(o.getAttribute("data-vmorig")) return; var f=fl(o.value); o.setAttribute("data-vmorig",o.value); o.value=f.name+" · "+f.no; });
    jobs.map(function(o){return {o:o,k:o.value.toLowerCase()};}).sort(cmp).forEach(function(it){ dl.appendChild(it.o); });
  }
  var busy=false;
  function scan(){ if(busy) return; busy=true; try{ document.querySelectorAll("select").forEach(doSelect); document.querySelectorAll("datalist").forEach(doList); }catch(e){} busy=false; }
  function back(e){ var t=e.target; if(!t||t.tagName!=="INPUT"||!t.getAttribute("list")) return; var m=REV.exec(String(t.value||"").trim()); if(m) t.value=m[2]+" "+m[1]; }
  document.addEventListener("input",back,true); document.addEventListener("change",back,true); document.addEventListener("focusout",back,true);
  var tmr=null; new MutationObserver(function(){ if(busy) return; clearTimeout(tmr); tmr=setTimeout(scan,30); }).observe(document.documentElement,{childList:true,subtree:true});
  if(document.readyState!=="loading") scan(); else document.addEventListener("DOMContentLoaded",scan);
  window.vmJobScan=scan;
})();
</script>
