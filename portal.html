<meta charset="utf-8">

<title>Vision Mechanical — Employee Portal</title>
<style>
:root{--vm:#c0392b;--vm2:#7f1d1d;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--bg:#f4f5f7}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
header{background:linear-gradient(135deg,var(--vm),var(--vm2));color:#fff;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header .row{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px}
header img{height:44px;width:auto;background:#fff;border-radius:8px;padding:5px 7px;box-shadow:0 1px 3px rgba(0,0,0,.2);flex:0 0 auto}
header h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.3px}
header .who{font-size:12px;opacity:.9;margin-top:2px}
.wrap{max-width:820px;margin:0 auto;padding:18px 14px 60px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.tile{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 16px;text-decoration:none;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.05);transition:.12s}
.tile:hover{border-color:var(--vm);box-shadow:0 4px 14px rgba(192,57,43,.15);transform:translateY(-1px)}
.tile .ic{width:46px;height:46px;flex:0 0 auto;border-radius:12px;background:#fdecea;color:var(--vm);display:flex;align-items:center;justify-content:center;font-size:22px}
.tile .tx b{display:block;font-size:16px;color:var(--vm2)}
.tile .tx span{font-size:12.5px;color:var(--mut)}
.sec{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);margin:22px 4px 8px}
.gate{position:fixed;inset:0;background:linear-gradient(135deg,var(--vm),var(--vm2));display:flex;align-items:center;justify-content:center;z-index:100;color:#fff;text-align:center;padding:24px}
.gate .box{max-width:360px}
.gate img{height:74px;width:auto;background:#fff;border-radius:12px;padding:8px 12px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.gate h1{font-size:22px;margin:0 0 6px}
.gate p{opacity:.9;font-size:14px;margin:0 0 20px}
.gate button{background:#fff;color:var(--vm2);border:none;border-radius:10px;padding:13px 22px;font-size:15px;font-weight:700;cursor:pointer}
.gate .msg{margin-top:14px;font-size:13px;opacity:.9}
.tile[data-role]{display:none}
.tile[data-role].show{display:flex}
.sec.empty-sec,.grid.empty-sec{display:none}
.foot{text-align:center;font-size:11px;color:var(--mut);margin-top:28px;line-height:1.5}
.myday{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.myday .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.myday .hd b{font-size:17px;color:var(--vm2)}
.rolechips{display:flex;gap:5px;flex-wrap:wrap}.rolechips button{border:1.5px solid #e5c7c3;background:#fff;color:var(--vm2);border-radius:16px;padding:4px 11px;font-size:12px;font-weight:700;cursor:pointer}
.rolechips button.on{background:var(--vm2);border-color:var(--vm2);color:#fff}
.due{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.due a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13px;font-weight:700;border-radius:18px;padding:6px 12px;background:#eef2f7;color:#475569}
.due a.ok{background:#dcfce7;color:#15803d}.due a.warn{background:#fef3c7;color:#92400e}.due a.bad{background:#fde8e8;color:#b91c1c}
.myday .grid .tile{padding:14px 14px}.myday .grid .tile .ic{width:40px;height:40px;font-size:20px}
.allhd{display:flex;justify-content:space-between;align-items:center;margin:26px 4px 0}
.allhd b{font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--vm2)}
.allhd input{border:1.5px solid #cbd5e1;border-radius:9px;padding:7px 10px;font-size:14px;width:180px;max-width:50%}
</style>

];

function pad(n){return (n<10?"0":"")+n;}
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }

var SITE_URL="https://graph.microsoft.com/v1.0/sites/visionmech.sharepoint.com,ccfe4256-b2bf-4a3b-8e37-50f8021bb3b2,acce7714-1643-4364-86e0-8641745e0281/lists/";

async function loadDue(tok,em,myName){
  var pills=[], now=new Date(), today=ymd(now), dow=now.getDay(), weekday=dow>=1&&dow<=5, late=now.getHours()*60+now.getMinutes()>=14*60+30;
  var mon=new Date(now); mon.setDate(now.getDate()-((dow+6)%7)); var monday=ymd(mon);
  var q=function(s){ return String(s).replace(/'/g,"''"); };

      pills.push({o:1,c:done?"ok":(late?"bad":"warn"),t:done?"&#10003; Daily log in":"Daily log due today",h:"/"}); }).catch(function(){}));
    jobs.push(rows(tok,"91c4a3db-97f6-4b52-a855-516d5c414124","WorkDate,ForemanEmail","fields/ForemanEmail eq '"+q(em)+"'").then(function(r){ if(!weekday) return; var done=r.some(function(x){return d10(x.WorkDate)===today;});

    jobs.push(rows(tok,"3c787f11-c841-4fc9-a4c1-d04e11b6cd2c","WeekOf,LoginEmail","fields/LoginEmail eq '"+q(em)+"'").then(function(r){ var done=r.some(function(x){ return d10(x.WeekOf)>=monday; });
      pills.push({o:3,c:done?"ok":(dow>=4||dow===0?"bad":"warn"),t:done?"&#10003; Look-ahead in this week":"Look-ahead due this week",h:"/lookahead.html"}); }).catch(function(){}));

    var me=null, all=[];
    function page(u){ return fetch(u,{headers:{Authorization:"Bearer "+tok.accessToken}}).then(function(x){return x.json();}).then(function(j){
      if(j.error) throw new Error(j.error.message||"no access");
      (j.value||[]).forEach(function(it){ var f=it.fields||{}; all.push(f); if((f.Active||"Yes")==="No") return; var e2=(f.LoginEmail||"").toLowerCase().trim()||autoEmail(f.EmployeeName); if(e2===em) me=f; });
      if(j["@odata.nextLink"]) return page(j["@odata.nextLink"]); }); }
    return page(EMP_URL).then(function(){
      VMR.store(all);
      var r={owner:VMR.isOwner(em), admin:false, pm:VMR.isPM(em), foreman:false, shop:false, svc:VMR.isSvc(em)};
      if(!me && !r.owner) roleNote("Signed in as "+em+" — not found in Employee Setup, so office buttons are hidden. Check the login email on your employee record.");
      if(me){ r.owner=truthy(me.Owner)||(!("Owner" in me)&&r.owner); r.pm=truthy(me.PM)||(!("PM" in me)&&r.pm); r.svc=truthy(me.ServiceTech)||(!("ServiceTech" in me)&&r.svc);
        r.admin=truthy(me.Admin); r.foreman=truthy(me.Foreman); r.shop=truthy(me.ShopAccess); }
      r.admin=r.admin||r.owner;
      ROLE=r; render();
      try{ localStorage.setItem("vm_roles_v1",JSON.stringify({em:em,r:r})); }catch(e){}
      loadDue(tok.accessToken,em,me?String(me.EmployeeName||""):"");
    }).catch(function(e){ roleNote("Couldn't check your access ("+e.message+"). Office buttons may be hidden — tell the office."); });
  }).catch(function(e){
    roleNote("Microsoft needs you to confirm access on this device ("+(e&&(e.errorCode||e.message)||"sign-in")+"). Tap the button and approve, then you'll land back here.",acct);
    try{ if(!sessionStorage.getItem("vm_roles_try")){ sessionStorage.setItem("vm_roles_try","1"); msalInstance.acquireTokenRedirect({scopes:[GRAPH_SCOPE],account:acct}); } }catch(e){}
  });
}
function start(){
  msalInstance.handleRedirectPromise().then(function(resp){
    if(resp&&resp.accessToken&&resp.scopes&&resp.scopes.join(" ").toLowerCase().indexOf("sites.readwrite.all")>-1) REDIR_TOKEN=resp.accessToken;
    var all=msalInstance.getAllAccounts(), acct=msalInstance.getActiveAccount()||all.filter(function(a){return /@visionmech\.net$/i.test(a.username||"");})[0]||all[0];
    if(acct){ msalInstance.setActiveAccount(acct); showApp(acct); }
  }).catch(function(e){ E("gateMsg").textContent="Sign-in problem: "+String(e); });
}
E("signin").onclick=function(){ msalInstance.loginRedirect({scopes:["openid","profile","email",GRAPH_SCOPE]}); };
start();
</script>
<script src="/feedback.js" defer></script>
