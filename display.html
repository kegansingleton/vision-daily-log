<head>

<title>Vision Mechanical — Display</title>
<style>
/* TV / kiosk display. Dark, high-contrast, 16:9, sized in vw/vh. Categorical colors are the
   validated palette (fixed order) at its dark-surface steps. */
:root{
  color-scheme:dark;
  --vm:#c0392b;--vm2:#7f1d1d;
  --page:#0d0d0d;--surface:#1a1a19;--surface2:#242423;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a29b;--axis:#898781;
  --grid:#2c2c2a;--base:#4a4945;--border:rgba(255,255,255,.12);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--other:#898781;
  --good:#0ca30c;--goodtxt:#3cc23c;--warn:#fab219;--crit:#d03b3b;--crittxt:#ef7777;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--page);color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;cursor:default;-webkit-font-smoothing:antialiased}
/* ---- chrome ---- */
#hdr{position:fixed;top:0;left:0;right:0;height:7vh;display:flex;align-items:center;gap:1.4vw;padding:0 2vw;background:var(--surface);border-bottom:.3vh solid var(--vm);z-index:5}
#hdr img{height:5vh;width:auto;background:#fff;border-radius:.7vh;padding:.45vh .6vw}
#chan{font-size:2.2vw;font-weight:700;letter-spacing:.01em;white-space:nowrap}
#pos{font-size:1.5vw;color:var(--muted);font-variant-numeric:tabular-nums}
#upd{margin-left:auto;font-size:1.5vw;color:var(--muted);white-space:nowrap;text-align:right}
#upd .rc{color:var(--warn);font-weight:700}
#upd button{font:inherit;font-weight:700;color:#fff;background:var(--vm);border:0;border-radius:.6vh;padding:.4vh .8vw;margin-left:.6vw;cursor:pointer}
#clock{font-size:2.5vw;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
#clock small{font-size:1.4vw;color:var(--muted);font-weight:600;margin-right:.8vw}
#progT{position:fixed;top:7vh;left:0;right:0;height:.55vh;background:var(--grid);z-index:5}
#prog{height:100%;width:0;background:var(--ink2)}
#stage{position:fixed;top:7.55vh;left:0;right:0;bottom:0;overflow:hidden}
.slide{position:absolute;inset:0;padding:3.2vh 3vw 3vh;opacity:0;visibility:hidden;transition:opacity .7s,visibility 0s .7s;overflow:hidden;display:flex;flex-direction:column}
.slide.on{opacity:1;visibility:visible;transition:opacity .7s,visibility 0s 0s}
.slide.flush{padding:0}
.st{font-size:3.3vw;font-weight:800;margin:0;line-height:1.1;letter-spacing:-.01em}
.st .k{color:var(--muted);font-weight:600}
.lede{font-size:2.3vw;color:var(--ink2);margin:.8vh 0 0}
.body{flex:1;min-height:0;display:flex;gap:2.4vw;margin-top:3vh}
.card{background:var(--surface);border-radius:1.4vh;padding:2.6vh 2vw;display:flex;flex-direction:column;min-width:0;min-height:0}
.sw{display:inline-block;width:1.7vw;height:1.7vw;border-radius:.4vw;margin-right:.9vw;vertical-align:-.15vw;flex:none}
/* KPI tiles */
.kl{font-size:2.7vw;font-weight:700;color:var(--ink2);display:flex;align-items:center;line-height:1.15}
.kv{font-size:10vw;font-weight:700;line-height:1;letter-spacing:-.02em;margin:1.2vh 0 .6vh}
.kv small{font-size:3.2vw;font-weight:600;color:var(--ink2);letter-spacing:0;margin-left:.8vw}
.kv.dash{color:var(--muted)}
.ks{font-size:2.4vw;color:var(--ink2);line-height:1.25}
.up{color:var(--goodtxt);font-weight:700}.down{color:var(--crittxt);font-weight:700}.flat{color:var(--muted);font-weight:700}
.legend{display:flex;gap:2.4vw;font-size:2.3vw;color:var(--ink2);margin-bottom:1vh;flex-wrap:wrap}
.legend span{display:flex;align-items:center}
.legend i{display:inline-block;width:2.6vw;height:.6vw;border-radius:.3vw;margin-right:.8vw}
.chart{flex:1;min-height:0;position:relative}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chart text{fill:var(--ink2)}
.chart .tk{fill:var(--axis);font-variant-numeric:tabular-nums}
.chart .cap{fill:var(--ink);font-weight:700}
/* horizontal bars (CSS) */
.hb{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:1.6vw;row-gap:2vh}
.hb .lb{font-size:2.6vw;font-weight:600;color:var(--ink);display:flex;align-items:center;white-space:nowrap}
.hb .tr{position:relative;height:3.6vh;display:flex;align-items:center}
.hb .bar{height:100%;border-radius:0 .5vw .5vw 0;min-width:2px}
.hb .val{font-size:2.6vw;font-weight:700;margin-left:1vw;white-space:nowrap;font-variant-numeric:tabular-nums}
.hb .val small{font-size:1.9vw;color:var(--muted);font-weight:600;margin-left:.6vw}
.hb .none{font-size:2.3vw;color:var(--muted);white-space:nowrap}
/* tables / rows */
.rows{display:flex;flex-direction:column;gap:1.1vh;margin-top:2.2vh;flex:1;min-height:0}
.row{display:grid;align-items:center;background:var(--surface);border-radius:1.1vh;padding:0 1.6vw;height:8.4vh;font-size:2.6vw;column-gap:1.6vw;border-left:.6vw solid transparent}
.row.hd{background:none;height:4.4vh;white-space:nowrap;font-size:1.8vw;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.row .el{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .num{text-align:right;font-variant-numeric:tabular-nums}
.row.late{border-left-color:var(--crit)}
.row .lt{color:var(--crittxt);font-weight:800}
.pill{display:inline-block;font-size:1.9vw;font-weight:800;padding:.3vh .9vw;border-radius:.8vh;letter-spacing:.03em;white-space:nowrap}
.p-rush{background:var(--crit);color:#fff}
.p-new{border:.25vh solid var(--base);color:var(--ink2)}
.p-cut{background:var(--surface2);color:var(--ink);border:.25vh solid var(--ink2)}
.qsum{font-size:2.4vw;color:var(--ink2);white-space:nowrap}
.qsum b{color:var(--ink)}.qsum .lt{color:var(--crittxt);font-weight:800}
.more{font-size:2vw;color:var(--muted);margin-top:1vh}
/* actions */
.arow{display:grid;grid-template-columns:19vw 1fr auto;align-items:center;column-gap:1.8vw;background:var(--surface);border-radius:1.1vh;padding:1.1vh 1.6vw;min-height:10vh;border-left:.6vw solid transparent}
.arow.od{border-left-color:var(--crit)}
.arow .due{font-size:2.5vw;font-weight:800;line-height:1.1}
.arow .due.od{color:var(--crittxt)}
.arow .due.wk{color:var(--ink)}
.arow .due.later{color:var(--muted);font-weight:700}
.arow .t{font-size:2.8vw;font-weight:700;line-height:1.12;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.arow .j{font-size:2vw;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.3vh}
.p-hi{border:.25vh solid var(--crittxt);color:var(--crittxt)}
.pf-b{background:var(--crit);color:#fff}.pf-w{background:var(--warn);color:#141414}.pf-g{background:var(--good);color:#fff}
.ok{color:var(--goodtxt);font-weight:700}.warnt{color:var(--warn);font-weight:700}
.meter{height:2.2vh;border-radius:1.1vh;background:#163a63;margin-top:1.2vh;overflow:hidden}.meter span{display:block;height:100%;background:var(--s1);border-radius:1.1vh}
.p-lo{border:.25vh solid var(--base);color:var(--muted)}
/* hero / centered */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero{font-size:16vw;font-weight:700;line-height:1;letter-spacing:-.03em}
.big2{font-size:4vw;font-weight:800;line-height:1.15}
.mid{font-size:2.6vw;color:var(--ink2);margin-top:2vh}
/* lobby tiles */
.tiles{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2.6vw;margin-top:3.5vh;min-height:0}
.tile{background:var(--surface);border-radius:1.6vh;padding:5vh 2.6vw;display:flex;flex-direction:column;justify-content:center}
.tile .kv{font-size:12vw}
.tiles.money{grid-auto-columns:minmax(0,1fr)}.tiles.money .tile{min-width:0}.tiles.money .tile .kv{font-size:7.6vw;white-space:nowrap}
.tile .kl{font-size:3vw;color:var(--ink);min-height:7vw;align-items:flex-end}
.tile .ks{margin-top:1.4vh}
/* brand */
.brand{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,#2a1311 0%,var(--page) 70%)}
.brand img{height:24vh;width:auto;background:#fff;border-radius:2.4vh;padding:2.4vh 2.4vw;box-shadow:0 1vh 4vh rgba(0,0,0,.6)}
.brand h1{font-size:6.2vw;margin:5vh 0 0;font-weight:800;letter-spacing:-.01em}
.brand .loc{font-size:3.6vw;color:var(--ink2);margin-top:1vh;font-weight:600}
.brand .tag{font-size:2.5vw;color:var(--muted);margin-top:4vh}
.brand .rule{width:12vw;height:.6vh;background:var(--vm);border-radius:.3vh;margin-top:4vh}
/* toolbox */
.tb{flex:1;display:flex;gap:3vw;min-height:0;align-items:stretch}
.tb .meta{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
.tb .ttl{font-size:4.6vw;font-weight:800;line-height:1.08;margin-top:2vh;overflow-wrap:anywhere}
.tb .pg{height:100%;display:flex;align-items:center;justify-content:center;flex:none}
.tb .pg img{max-height:100%;max-width:52vw;background:#fff;border-radius:.6vh;box-shadow:0 1vh 4vh rgba(0,0,0,.6)}
/* office dashboard iframe */
.dashwrap{position:absolute;inset:0;overflow:hidden;background:#f4f5f7}
.dashwrap iframe{border:0;position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;background:#f4f5f7}
/* overlays */
#gate{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 35%,#3a1512 0%,#0d0d0d 75%)}
#gate img{height:16vh;background:#fff;border-radius:2vh;padding:2vh 2vw}
#gate .gt{font-size:3.4vw;font-weight:700;margin-top:4vh}
#gate button{margin-top:5vh;font:inherit;font-size:5vw;font-weight:800;color:#fff;background:var(--vm);border:0;border-radius:2.4vh;padding:3.6vh 6vw;cursor:pointer;box-shadow:0 1vh 5vh rgba(192,57,43,.45)}
#gate .gm{font-size:2vw;color:var(--muted);margin-top:4vh;max-width:70vw}
#hint{position:fixed;left:50%;bottom:4vh;transform:translateX(-50%);z-index:15;background:rgba(26,26,25,.94);border:1px solid var(--border);color:var(--ink);font-size:1.8vw;font-weight:600;padding:1.4vh 2vw;border-radius:1.2vh;transition:opacity 1s;cursor:pointer}
#hint.off{opacity:0;pointer-events:none}
</style>

<script>
/* ======================================================================
   Vision Mechanical — TV / kiosk display (read-only)
   display.html?screen=owner|pm|lobby|sm|pipe  [&sec=20] [&who=email] [&zoom=1.3]
     owner  (alias: office) owner dashboard + manpower iframes, my action items, overdue by person
     pm     the signed-in PM's jobs (or ?who=email): action items, job hours/PF, field reporting, watch list, closeout
     lobby  company KPIs only — no names, job names or dollars
     sm / pipe  shop floor: fab rates, pounds/feet, shop queue (sm), toolbox talk, days since recordable
   ?who= blank → whoever is signed in on this screen.
   This page only ever GETs from Microsoft Graph. It never writes.
   ====================================================================== */
var SCOPE="https://graph.microsoft.com/Sites.ReadWrite.All";
var SITE="visionmech.sharepoint.com,ccfe4256-b2bf-4a3b-8e37-50f8021bb3b2,acce7714-1643-4364-86e0-8641745e0281";
var SITEURL="https://graph.microsoft.com/v1.0/sites/"+SITE, GRAPH=SITEURL+"/lists/";
var JOBS="836523ba-cd20-4736-98ce-5716668b8973", EMP="537b8d9b-e666-43d1-9441-efc2bed48d73", JOBTASKS="192b6fd5-5a12-47c1-9d1b-ba4b51e13371", LOGS="bccd1165-a999-41b4-9cae-394d0766fb4a", LOOK="3c787f11-c841-4fc9-a4c1-d04e11b6cd2c";
var SHOP="b7bdc3ee-538a-404a-9046-1e26562ffe6d", TC="91c4a3db-97f6-4b52-a855-516d5c414124", ACTIONS="25279cba-004d-4b8c-8356-4b32f24d9cc8";
var PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js", PDFJS_W="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
var LS_USER="vmDisplayLastUser";
var REFRESH_MS=5*60*1000, AUTH_RETRY_MS=10*60*1000;
var Q=new URLSearchParams(location.search);
var CHANNELS={owner:"Owner’s Office",pm:"Project Manager",lobby:"Welcome to Vision Mechanical",sm:"Shop — Sheet Metal",pipe:"Shop — Pipe"};
var SCREEN=String(Q.get("screen")||"lobby").toLowerCase(); if(SCREEN==="office") SCREEN="owner";   /* old shortcuts */
if(!CHANNELS[SCREEN]) SCREEN="lobby";   /* unknown → lobby: the safe, no-names channel */
var SEC=Math.max(1,parseFloat(Q.get("sec"))||20);
var WHO_PARAM=String(Q.get("who")||"").trim().toLowerCase(); var WHO=WHO_PARAM;   /* blank = whoever is signed in on this screen */
var ZOOM=Math.min(2,Math.max(.8,parseFloat(Q.get("zoom"))||1.3));
var BOOT=Date.now();

/* ---- shop groups (same as shopdash.html) ---- */
var SM_GROUP={"1230":"Duct","1250":"Fittings","1210":"Pre-assembly","1240":"Welded steel"};
var PIPE_GROUP={"1810":"Steel pipe","1820":"Copper","1830":"PVC","1840":"Cast iron","1850":"Aquatherm"};
var PIPE_GROUPS=["Steel — threaded","Steel — welded","Steel — grooved","Steel pipe","Copper","PVC","Cast iron","Aquatherm"];
/* color follows the entity (same slot mapping as shopdash.html), dark-surface steps */
var GCOLOR={"Duct":"var(--s1)","Fittings":"var(--s2)","Steel — threaded":"var(--s1)","Steel — welded":"var(--s2)","Steel — grooved":"var(--s3)","Copper":"var(--s4)","PVC":"var(--s5)","Cast iron":"var(--s6)","Aquatherm":"var(--s7)","Steel pipe":"var(--other)","Other":"var(--other)"};
function grpOf(f){ if(f.FabType==="Pipe"){ if(f.PhaseCode==="1810"){ var m=String(f.Material||"").toLowerCase(); if(/thread/.test(m)) return "Steel — threaded"; if(/weld/.test(m)) return "Steel — welded"; if(/groov|victaulic/.test(m)) return "Steel — grooved"; } return PIPE_GROUP[f.PhaseCode]||"Other"; } return f.SMGroup||SM_GROUP[f.PhaseCode]||"Other"; }

/* ===== helpers ===== */
function E(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return (n<10?"0":"")+n;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function parseISO(s){var p=String(s).slice(0,10).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function dkey(v){return String(v||"").slice(0,10);}
function okDate(s){return /^\d{4}-\d\d-\d\d$/.test(dkey(s));}
function payWeekStart(d){var x=new Date(d);var diff=(x.getDay()-3+7)%7;var s=addDays(x,-diff);s.setHours(0,0,0,0);return s;}   /* pay week = Wed–Tue */
function daysBetween(a,b){return Math.round((parseISO(b)-parseISO(a))/864e5);}
function monthStart(){var d=new Date();return iso(new Date(d.getFullYear(),d.getMonth(),1));}
function monthName(){return new Date().toLocaleDateString([], {month:"long"});}
function shortD(s){var p=dkey(s).split("-");return p.length===3?(+p[1]+"/"+ +p[2]):s;}
function dayD(s){var d=parseISO(s);return d.toLocaleDateString([], {weekday:"short"})+" "+shortD(s);}
function longD(s){return parseISO(s).toLocaleDateString([], {month:"short",day:"numeric",year:"numeric"});}
function yes(v){return v===true||v==="Yes"||v==="yes"||v==="true"||v===1;}
function val(v){return (v&&typeof v==="object"&&"Value" in v)?v.Value:v;}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0;}
function lead(v){var m=/-?\d+(\.\d+)?/.exec(String(v==null?"":v));return m?parseFloat(m[0]):0;}   /* "5 of 7" → 5 */
function jobNo(v){return String(v||"").trim().split(/\s+/)[0];}
function fmt(n){return Math.round(n||0).toLocaleString();}
function n1(n){return (Math.round((n||0)*10)/10).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:1});}
function rateTxt(v){return v==null?"—":(v>=100?fmt(v):n1(v));}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function niceStep(max,target){ if(max<=0) return 1; var raw=max/target, p=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/p; return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p; }
function tickLbl(v,top){ return top>=10000?(v>=1000?(Math.round(v/100)/10)+"K":String(v)):v.toLocaleString(); }
function delta(cur,prev,unit,dec){ if(cur==null||prev==null) return '<span class="flat">no comparison</span>'; var d=cur-prev, t=dec?n1(Math.abs(d)):fmt(Math.abs(d)); if(Math.abs(d)<(dec?0.05:0.5)) return '<span class="flat">= same</span> as last week'; return '<span class="'+(d>0?"up":"down")+'">'+(d>0?"&#9650; +":"&#9660; &minus;")+t+'</span> '+esc(unit)+' vs last week'; }

/* ===== auth (unattended) ===== */
function AuthError(msg){ this.message=msg||"Sign-in needed"; }
function Missing(name){ this.name=name; this.message='"'+name+'" list not found'; }
var msalApp=null, account=null, AUTH_BAD=false, tokP=null;
function pickAccount(){ var a=null; try{ a=msalApp.getActiveAccount(); }catch(e){} if(a) return a; var all=msalApp.getAllAccounts()||[]; return all.filter(function(x){return /@visionmech\.net$/i.test(x.username||"");})[0]||all[0]||null; }
function remember(a){ if(a&&a.username){ lsSet(LS_USER,a.username); } }
async function tokenNow(){
  if(!account) account=pickAccount();
  if(account){ try{ var r=await msalApp.acquireTokenSilent({scopes:[SCOPE],account:account}); if(r.account){ account=r.account; } remember(account); return r.accessToken; }catch(e){ console.warn("silent token failed",e&&e.errorCode||e); } }
  var hint=lsGet(LS_USER)||(account&&account.username)||"";
  try{ var o={scopes:[SCOPE]}; if(hint) o.loginHint=hint; var r2=await msalApp.ssoSilent(o); account=r2.account; try{ msalApp.setActiveAccount(account); }catch(e){} remember(account); return r2.accessToken; }
  catch(e2){ console.warn("ssoSilent failed",e2&&e2.errorCode||e2); }
  throw new AuthError();   /* never acquireTokenRedirect here — nobody is at this screen */
}
function getToken(){ if(!tokP){ tokP=tokenNow(); tokP.then(function(){tokP=null;},function(){tokP=null;}); } return tokP; }
async function gfetch(url,headers){
  var t=await getToken();
  var r=await fetch(url,{headers:Object.assign({Authorization:"Bearer "+t},headers||{})});   /* GET only */
  if(r.status===401){ var e1=new AuthError("401"); throw e1; }
  if(!r.ok){ var tx=""; try{tx=await r.text();}catch(e){} var er=new Error("HTTP "+r.status+" "+tx.slice(0,120)); er.status=r.status; throw er; }
  return r.json();

function jl(no,name){ return name?esc(name)+' <span style="color:var(--muted)">· '+esc(no)+'</span>':esc(no); }
function pageHead(title,k,p,pages,sum){ return '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:2vw"><h2 class="st">'+title+(k||pages>1?' <span class="k">'+(k?'· '+k:'')+(pages>1?' · '+(p+1)+' of '+pages:'')+'</span>':'')+'</h2>'+(sum||'')+'</div>'; }
function paged(key,items,per,fn){ var pages=Math.max(1,Math.ceil(items.length/per)), out=[]; for(var p=0;p<pages;p++) out.push({key:key+(p+1),html:fn(items.slice(p*per,(p+1)*per),p,pages)}); return out; }
function pfPill(v){ if(v==null) return '<span style="color:var(--muted)">—</span>'; var c=v>=1?"pf-g":(v>=0.9?"pf-w":"pf-b"); return '<span class="pill '+c+'">'+(v>=1?"&#9650; ":v>=0.9?"&#9679; ":"&#9660; ")+(Math.round(v*100)/100).toFixed(2)+'</span>'; }
function pmSlides(P){
  var out=[], who=pmFirst(P);
  if(!P.jobs.length){ out.push({key:"pmnone",html:'<h2 class="st">'+esc(who)+'’s jobs</h2><div class="center"><div class="big2">No jobs list you as PM</div><div class="mid">Set the PM on each job in <b style="color:var(--ink)">Job Setup</b>'+(P.name?' — looking for “'+esc(P.name)+'”':' — signed in as '+esc(P.email))+'.</div></div>'}); return out; }
  /* b. jobs at a glance */
  if(P.sched&&P.sched.length){
    var rows=P.sched.slice().sort(function(a,b){ return (a.pf==null?9:a.pf)-(b.pf==null?9:b.pf)||a.no.localeCompare(b.no); });
    var cols="grid-template-columns:1fr 7vw 7.5vw 7.5vw 6.5vw 7.5vw 9.5vw 8.5vw";
    out=out.concat(paged("pmjobs",rows,7,function(rs,p,pages){
      return pageHead(esc(who)+'’s jobs','hours',p,pages,'<div class="qsum">this pay week &middot; to date</div>')+
        '<div class="rows"><div class="row hd" style="'+cols+'"><div>Job</div><div class="num">Hrs wk</div><div class="num">Budget</div><div class="num">Actual</div><div class="num">Done</div><div class="num">Earned</div><div class="num">PF</div><div class="num">Forecast</div></div>'+
        rs.map(function(j){ var over=j.fc!=null&&j.bud>0&&j.fc>j.bud;
          return '<div class="row'+(j.pf!=null&&j.pf<0.9?" late":"")+'" style="'+cols+';font-size:2.4vw;height:auto;min-height:9vh;padding-top:.8vh;padding-bottom:.8vh"><div style="min-width:0"><div class="el">'+esc(j.name||j.no)+'</div>'+(j.name?'<div class="el" style="font-size:1.8vw;color:var(--muted)">'+esc(j.no)+'</div>':'')+'</div><div class="num">'+fmt(j.wk)+'</div><div class="num">'+(j.tasks?fmt(j.bud):'<span style="color:var(--muted)">—</span>')+'</div><div class="num">'+fmt(j.act)+'</div><div class="num">'+(j.bud>0?Math.round(j.pct)+'%':'—')+'</div><div class="num">'+(j.bud>0?fmt(j.earn):'—')+'</div><div class="num">'+pfPill(j.pf)+'</div><div class="num'+(over?' lt':'')+'">'+(j.fc==null?'—':fmt(j.fc))+'</div></div>'; }).join("")+'</div>'+
        '<div class="more">PF = earned ÷ actual hrs (1.00+ on track) · Forecast = actual ÷ % done, red if over budget</div>';
    }));
  }
  /* c. field reporting */
  if(P.field&&P.field.length){
    var now=new Date(), mon=new Date(now); mon.setDate(mon.getDate()-((mon.getDay()+6)%7)); var stale=iso(addDays(mon,-7));
    var fr=P.field.map(function(f){ var bad=0, log, la;
      if(f.logs) log='<span class="ok">&#10003; '+f.logs+' log'+(f.logs>1?"s":"")+' in</span>';
      else if(f.crews){ log='<span class="lt">&#9888; Missing</span>'; bad=2; }
      else log='<span style="color:var(--muted)">No time yet</span>';
      if(f.lookErr) la='<span style="color:var(--muted)">—</span>';
      else if(!f.look){ la='<span class="warnt">&#9888; None on file</span>'; bad=Math.max(bad,1); }
      else { var old=f.look.week<stale; la=(f.look.late||old?'<span class="lt">&#9888; ':'<span>')+esc(shortD(f.look.week))+(f.look.late?' · LATE':old?' · stale':'')+(f.look.status?' · '+esc(f.look.status):'')+'</span>'; if(f.look.late||old) bad=Math.max(bad,2); }
      return {f:f,bad:bad,log:log,la:la}; }).sort(function(a,b){ return b.bad-a.bad||a.f.no.localeCompare(b.f.no); });
    var miss=fr.filter(function(x){return x.f.crews&&!x.f.logs;}).length;
    var cols2="grid-template-columns:1fr 19vw 33vw";
    out=out.concat(paged("pmfield",fr,7,function(rs,p,pages){
      return pageHead('Field reporting','my jobs',p,pages,'<div class="qsum">'+(miss?'<span class="lt">&#9888; '+miss+' log'+(miss>1?"s":"")+' missing today</span>':'<b>Daily logs</b> today')+'</div>')+
        '<div class="rows"><div class="row hd" style="'+cols2+'"><div>Job</div><div>Daily log today</div><div>Latest look-ahead (week of)</div></div>'+
        rs.map(function(x){ return '<div class="row'+(x.bad>=2?" late":"")+'" style="'+cols2+';font-size:2.4vw"><div class="el">'+jl(x.f.no,x.f.name)+'</div><div class="el">'+x.log+'</div><div class="el">'+x.la+'</div></div>'; }).join("")+'</div>';
    }));
  }
  /* d. watch list */
  var W=[], JN=P.JN||{};
  (P.fit||[]).forEach(function(t){ W.push({sev:t.late?0:2,type:"FITTING",main:(t.rush?'<span class="pill p-rush">RUSH</span> ':'')+esc(t.no),job:t.job,right:t.late?'<span class="lt">&#9888; LATE '+esc(shortD(t.need))+'</span>':esc(t.st)+(t.need?' · need '+esc(shortD(t.need)):'')}); });
  (P.rent||[]).forEach(function(r){ var sev=r.past?0:(r.callOff?1:2); W.push({sev:sev,type:"RENTAL",main:esc(r.title),job:r.job,right:r.past?'<span class="lt">&#9888; '+daysBetween(r.off,iso(new Date()))+'d past off date</span>':r.callOff?'<span class="warnt">Call-off '+(r.callNo?'#'+esc(r.callNo):'requested')+'</span>':'On rent'+(r.off?' · off '+esc(shortD(r.off)):' · no off date')}); });
  (P.tm||[]).forEach(function(t){ var old=t.age!=null&&t.age>7; W.push({sev:old?0:1,type:"T&amp;M",main:esc(t.no||"—"),job:t.job,right:t.date?(old?'<span class="lt">&#9888; unsigned '+t.age+' days</span>':'<span class="warnt">unsigned · '+esc(shortD(t.date))+'</span>'):'<span class="warnt">unsigned</span>'}); });
  if(P.fit||P.rent||P.tm){
    W.sort(function(a,b){return a.sev-b.sev;});
    var red=W.filter(function(x){return x.sev===0;}).length;
    var cols3="grid-template-columns:11vw 1fr 28vw 26vw";
    if(!W.length) out.push({key:"pmwatch1",html:pageHead('Watch list','my jobs',0,1,'')+'<div class="center"><div class="hero" style="color:var(--goodtxt)">&#10003;</div><div class="big2">Nothing to chase</div><div class="mid">No unsigned T&amp;M, open fitting tickets or rentals on your jobs.</div></div>'});
    else out=out.concat(paged("pmwatch",W,7,function(rs,p,pages){
      return pageHead('Watch list','my jobs',p,pages,'<div class="qsum"><b>'+W.length+'</b> open'+(red?' &middot; <span class="lt">&#9888; '+red+' need action</span>':'')+'</div>')+
        '<div class="rows">'+rs.map(function(x){ return '<div class="row'+(x.sev===0?" late":"")+'" style="'+cols3+';font-size:2.4vw"><div><span class="pill p-new">'+x.type+'</span></div><div class="el">'+x.main+'</div><div class="el" style="color:var(--ink2)">'+esc(JN[x.job]||x.job)+'</div><div class="el">'+x.right+'</div></div>'; }).join("")+'</div>';
    }));
  }
  /* e. closeout */
  if(P.close&&P.close.length){
    var cl=P.close.slice().sort(function(a,b){return a.p-b.p;});
    out=out.concat(paged("pmclose",cl,6,function(rs,p,pages){
      return pageHead('Closeout','my jobs',p,pages,'')+'<div class="rows" style="gap:1.6vh">'+rs.map(function(x){
        return '<div class="card" style="padding:1.6vh 2vw;flex:none"><div style="display:flex;align-items:baseline;gap:1.6vw;font-size:2.5vw"><div class="el" style="flex:1;font-weight:700">'+jl(x.no,x.name)+'</div>'+(x.open!=null?'<div style="color:'+(x.open?'var(--ink2)':'var(--goodtxt)')+';white-space:nowrap">'+(x.open?fmt(x.open)+' item'+(x.open===1?"":"s")+' open':'&#10003; nothing open')+'</div>':'')+'<div style="font-weight:800;min-width:7vw;text-align:right">'+Math.round(x.p)+'%</div></div>'+
          '<div class="meter"><span style="width:'+x.p.toFixed(1)+'%"></span></div></div>'; }).join("")+'</div>';
    }));
  }
  return out;
}
/* lobby — company KPIs only: no names, no job names, no dollars */
function tile(label,v,sub){ return '<div class="tile"><div class="kl">'+label+'</div><div class="kv'+(v==null?" dash":"")+'">'+(v==null?"—":v)+'</div>'+(sub?'<div class="ks">'+sub+'</div>':'')+'</div>'; }
function bidStats(rows){ var w=0,l=0,o=0; rows.forEach(function(r){ if(r.st==="W") w++; else if(r.st==="L") l++; else o++; }); return {w:w,l:l,o:o,dec:w+l,pct:(w+l)?Math.round(w/(w+l)*100):null}; }
function bidSlides(B){
  var rows=B.rows, all=bidStats(rows), yr=String(new Date().getFullYear()), d12=iso(addDays(new Date(),-365));
  var ty=bidStats(rows.filter(function(r){return r.d.slice(0,4)===yr;})), l12=bidStats(rows.filter(function(r){return r.d>=d12;}));
  function pc(s){ return s.pct==null?null:s.pct+"<small>%</small>"; }
  function wl(s){ return s.dec?'<b>'+s.w+'</b> won &middot; <b>'+s.l+'</b> lost':"no decided bids yet"; }
  var out=[{key:"bids1",html:'<div style="display:flex;align-items:baseline;justify-content:space-between;gap:2vw"><h2 class="st">Bid hit / miss <span class="k">· won ÷ (won + lost)</span></h2><div class="qsum"><b>'+fmt(all.o)+'</b> bids still open</div></div><div class="tiles">'+
    tile("All time",pc(all),wl(all))+tile("This year &middot; "+yr,pc(ty),wl(ty))+tile("Last 12 months",pc(l12),wl(l12))+'</div>'}];
  /* dollars this year vs last year (owners' screens only) */
  function usd(n){ var a=Math.abs(n); return a>=1e6?"$"+(Math.round(n/1e5)/10)+"<small>M</small>":a>=1e3?"$"+Math.round(n/1e3)+"<small>K</small>":"$"+Math.round(n); }
  function usdTxt(n){ var a=Math.abs(n); return a>=1e6?"$"+(Math.round(n/1e5)/10)+"M":a>=1e3?"$"+Math.round(n/1e3)+"K":"$"+Math.round(n); }
  function dollars(y){ var b=0,a=0,nb=0,nw=0,o=0,no=0; rows.forEach(function(r){ if(r.d.slice(0,4)!==y) return; nb++; b+=r.bid||0; if(r.st==="W"){ nw++; a+=(r.award!=null?r.award:(r.bid||0)); } else if(r.st==="O"){ no++; o+=r.bid||0; } }); return {b:b,a:a,nb:nb,nw:nw,o:o,no:no}; }
  var cy=dollars(yr), py=dollars(String(+yr-1));
  out.push({key:"bids3",html:'<h2 class="st">Dollars bid &amp; awarded <span class="k">· '+yr+' so far</span></h2><div class="tiles money">'+
    tile("Total bid",usd(cy.b),'<b>'+cy.nb+'</b> bids &middot; '+(+yr-1)+': '+usdTxt(py.b))+
    tile("Awarded",usd(cy.a),'<b>'+cy.nw+'</b> won &middot; '+(+yr-1)+': '+usdTxt(py.a))+
    tile("Still out",usd(cy.o),'<b>'+cy.no+'</b> bids pending or no status')+'</div>'});
  function items(groups,order){ return order.map(function(k){ var s=bidStats(groups[k]); return {label:k,v:s.pct,txt:s.pct==null?"":s.pct+"%",sub:s.dec?s.w+"–"+s.l:"",none:"no decided bids"}; }); }
  var byY={}, byS={}; rows.forEach(function(r){ var y=r.d.slice(0,4)||"No date"; (byY[y]=byY[y]||[]).push(r); (byS[r.scope]=byS[r.scope]||[]).push(r); });
  var ys=Object.keys(byY).sort().reverse().slice(0,5), ss=Object.keys(byS).sort(function(a,b){return byS[b].length-byS[a].length;}).slice(0,6);
  out.push({key:"bids2",html:'<h2 class="st">Hit ratio <span class="k">· by year and by project type</span></h2><div class="body" style="gap:2.4vw;margin-top:3vh">'+
    '<div class="card" style="flex:1;justify-content:center"><div class="kl" style="margin-bottom:2.4vh">By year</div>'+hbars(items(byY,ys),100)+'</div>'+
    '<div class="card" style="flex:1;justify-content:center"><div class="kl" style="margin-bottom:2.4vh">By project type</div>'+hbars(items(byS,ss),100)+'</div></div>'});
  return out;
}
function lobbySlides(){
  var out=[brandSlide()], today=iso(new Date()), mn=esc(monthName());
  var t=[];
  if(D.inc&&D.inc.visible>0){ var since=D.inc.last?daysBetween(D.inc.last,today):null; if(since!=null) t.push(tile("Days without a recordable injury",fmt(since),"Every day, every crew")); }
  if(D.ptp) t.push(tile("Pre-task safety plans completed",fmt(D.ptp.n),"in "+mn+" so far"));
  if(t.length) out.push({key:"lsafety",html:'<h2 class="st">Safety first <span class="k">· '+mn+'</span></h2><div class="tiles">'+t.join("")+'</div>'});
  if(D.tcm) out.push({key:"lwork",html:'<h2 class="st">Our workload <span class="k">· '+mn+'</span></h2><div class="tiles">'+tile("Man-hours worked",fmt(D.tcm.hours),"by our crews this month")+tile("Active jobs",fmt(D.tcm.jobs),"with crews on them this month")+'</div>'});
  if(D.pm) out.push({key:"lsvc",html:'<h2 class="st">Service <span class="k">· '+mn+'</span></h2><div class="tiles">'+tile("Preventive-maintenance visits",fmt(D.pm.visits),"completed this month")+tile("Units serviced",fmt(D.pm.units),"HVAC &amp; mechanical equipment")+'</div>'});
  return out;
}
function buildList(){
  if(!EVER_LOADED&&SCREEN!=="owner") return [connectingSlide()];
  var L=[];
  if(SCREEN==="sm"){
    if(D.shop){ L.push(smRateSlide(D.shop)); L.push(smLbsSlide(D.shop)); }
    if(D.queue) L=L.concat(queueSlides(D.queue));
    if(D.toolbox&&D.toolbox.talks.length) L.push(toolboxSlide(D.toolbox));
    if(D.inc&&D.inc.visible>0) L.push(incSlide(D.inc));
  } else if(SCREEN==="pipe"){
    if(D.shop){ L.push(pipeRateSlide(D.shop)); L.push(pipeFeetSlide(D.shop)); }
    if(D.toolbox&&D.toolbox.talks.length) L.push(toolboxSlide(D.toolbox));
    if(D.inc&&D.inc.visible>0) L.push(incSlide(D.inc));
  } else if(SCREEN==="owner"){
    L.push(frameSlide("dash","/dashboard.html","Owner dashboard"));
    if(D.actions) L=L.concat(actionSlides(D.actions));
    if(D.bids&&D.bids.rows.length) L=L.concat(bidSlides(D.bids));
    L.push(frameSlide("manpower","/manpower.html","Manpower load"));
  } else if(SCREEN==="pm"){
    if(D.pmj&&D.pmj.name) E("chan").textContent="Project Manager — "+D.pmj.name;
    if(D.actions) L=L.concat(actionSlides(D.actions,true));
    if(D.pmj) L=L.concat(pmSlides(D.pmj));
  } else L=lobbySlides();
  if(!L.length) L.push(brandSlide());
  return L;
}

/* ===== rotation ===== */
var SL=[], CUR=0, EL={}, startT=0, run=null;
function rebuild(){
  var list=buildList(), curKey=SL[CUR]&&SL[CUR].key, stage=E("stage"), keep={};
  list.forEach(function(s){
    keep[s.key]=1; var el=EL[s.key];
    if(!el){ el=document.createElement("section"); el.className="slide"; el.setAttribute("data-key",s.key); stage.appendChild(el); EL[s.key]=el; if(s.persistent&&s.build) s.build(el); }
    el.classList.toggle("flush",!!s.flush);
    if(!s.persistent){ if(s.html!=null&&!s.onShow) el.innerHTML=s.html; if(s.draw) try{ s.draw(el); }catch(e){ console.error(e); } }
  });
  Object.keys(EL).forEach(function(k){ if(!keep[k]){ EL[k].remove(); delete EL[k]; } });
  var prevSlides=SL; SL=list;
  var idx=-1; for(var i=0;i<SL.length;i++) if(SL[i].key===curKey) idx=i;
  if(idx<0||!prevSlides.length) show(0); else { CUR=idx; markOn(); E("pos").textContent=SL.length>1?(CUR+1)+" / "+SL.length:""; if(SL[CUR].onShow&&!EL[SL[CUR].key].innerHTML) SL[CUR].onShow(EL[SL[CUR].key]); }
}
function markOn(){ Object.keys(EL).forEach(function(k){ EL[k].classList.toggle("on",SL[CUR]&&SL[CUR].key===k); }); }
function show(i){
  if(!SL.length) return; CUR=((i%SL.length)+SL.length)%SL.length; var s=SL[CUR], el=EL[s.key];
  if(s.onShow) try{ s.onShow(el); }catch(e){ console.error(e); }
  if(s.draw&&!s.persistent) try{ s.draw(el); }catch(e){}
  markOn(); startT=performance.now(); run=s.runner?s.runner():null;
  E("pos").textContent=SL.length>1?(CUR+1)+" / "+SL.length:"";
}
function next(){ show(CUR+1); } function prev(){ show(CUR-1); }
function tick(now){
  var p;
  if(run){ var r=run(now); p=r.p; if(r.done){ next(); p=0; } }
  else { p=(now-startT)/(SEC*1000); if(p>=1){ if(SL.length>1) next(); else startT=now; p=0; } }
  E("prog").style.width=(Math.min(1,Math.max(0,p))*100).toFixed(2)+"%";
  requestAnimationFrame(tick);
}

/* ===== header: clock, freshness, sign-in ===== */
function updClock(){ var d=new Date(); E("clock").innerHTML='<small>'+esc(d.toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"}))+'</small>'+esc(d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})); }
function updStatus(){
  var u=E("upd"), h="";
  if(LAST_OK){ var m=Math.floor((Date.now()-LAST_OK)/60000); h="Updated "+(m<1?"just now":m+" min ago"); }
  if(AUTH_BAD&&EVER_LOADED) h+=' <span class="rc">&#9888; sign-in needed</span><button id="reSign" type="button">Sign in</button>';
  else if(FAILING&&EVER_LOADED) h+=' <span class="rc">&#10227; reconnecting…</span>';
  else if(!EVER_LOADED) h=AUTH_BAD?"Waiting for sign-in":"Connecting…";
  u.innerHTML=h; var b=E("reSign"); if(b) b.onclick=function(ev){ ev.stopPropagation(); signIn(); };
}
function signIn(){ var o={scopes:[SCOPE]}, hint=lsGet(LS_USER); if(hint) o.loginHint=hint; try{ msalApp.loginRedirect(o); }catch(e){ E("gateMsg").textContent="Sign-in error: "+(e.message||e); } }
function showGate(msg){ E("gate").style.display="flex"; E("gateTitle").textContent="Vision Mechanical — "+CHANNELS[SCREEN]; if(msg) E("gateMsg").textContent=msg; }
E("gateBtn").onclick=function(ev){ ev.stopPropagation(); signIn(); };

/* ===== kiosk niceties ===== */
function goFull(){ var d=document.documentElement; if(!document.fullscreenElement&&d.requestFullscreen){ try{ var p=d.requestFullscreen(); if(p&&p.catch) p.catch(function(){}); }catch(e){} } }
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight"){ next(); e.preventDefault(); }
  else if(e.key==="ArrowLeft"){ prev(); e.preventDefault(); }
  else if(e.key==="f"||e.key==="F"){ goFull(); }
});
document.addEventListener("click",function(e){ if(e.target.closest&&e.target.closest("button")) return; goFull(); E("hint").classList.add("off"); });
setTimeout(function(){ E("hint").classList.add("off"); },10000);
var rsz; window.addEventListener("resize",function(){ clearTimeout(rsz); rsz=setTimeout(function(){ SL.forEach(function(s){ if(s.draw&&EL[s.key]) try{ s.draw(EL[s.key]); }catch(e){} }); },200); });
/* full reload once a night ~3:00 AM (clears memory, picks up new page versions) */
setInterval(function(){ var d=new Date(); if(d.getHours()===3&&d.getMinutes()<15&&Date.now()-BOOT>2*3600*1000) location.reload(); },60000);
setInterval(function(){ updClock(); updStatus(); },15000);
window.addEventListener("error",function(e){ console.warn("page error",e.message); });

/* ===== boot ===== */
(async function boot(){
  document.title="Vision Mechanical — "+CHANNELS[SCREEN]; E("chan").textContent=CHANNELS[SCREEN];
  updClock(); rebuild(); requestAnimationFrame(tick);
  if(!window.msal){ E("upd").innerHTML='<span class="rc">&#10227; reconnecting…</span>'; setTimeout(function(){ location.reload(); },60000); return; }
  msalApp=new msal.PublicClientApplication({auth:{clientId:"ece3c8e3-0f54-49dc-bf83-b46411ade0aa",authority:"https://login.microsoftonline.com/8d64d0b9-91ba-4959-a83c-2e7e8cf233b3",redirectUri:(window.location.origin+window.location.pathname)},cache:{cacheLocation:"localStorage"}});
  var resp=null; try{ resp=await msalApp.handleRedirectPromise(); }catch(e){ console.warn("redirect",e); E("gateMsg").textContent="Sign-in error: "+(e.message||e)+" — will retry on its own."; }
  account=(resp&&resp.account)||pickAccount();
  if(account){ try{ msalApp.setActiveAccount(account); }catch(e){} remember(account); }
  loadAll();
})();
</script>
