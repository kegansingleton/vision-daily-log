<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#7f1d1d">
<title>Vision Mechanical — Fitting Ticket</title>
<style>
:root{--vm:#c0392b;--vm2:#7f1d1d;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--bg:#f4f5f7;--ok:#15803d;--okbg:#dcfce7;--red:#b91c1c;--redbg:#fde8e8;--amb:#b45309;--ambbg:#fef3c7;--gry:#475569;--grybg:#eef2f7}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
header{background:linear-gradient(135deg,var(--vm),var(--vm2));color:#fff;padding:12px 14px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header .row{display:flex;align-items:center;gap:12px;max-width:900px;margin:0 auto}
header img{height:36px;width:auto;background:#fff;border-radius:8px;padding:4px 6px}
header h1{margin:0;font-size:18px}header .who{font-size:12px;opacity:.9;margin-top:2px}
.wrap{max-width:900px;margin:0 auto;padding:12px 12px 100px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:15px;color:var(--vm2);display:flex;justify-content:space-between;align-items:center;gap:8px}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:9px 0 4px}
input,select,textarea{width:100%;padding:10px;font-size:16px;border:1.5px solid #9ca3af;border-radius:9px;background:#f3f5f8;font-family:inherit;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--vm);background:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:560px){.g3{grid-template-columns:1fr 1fr}}
.btn{padding:10px 14px;border:none;border-radius:9px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}
.btn-p{background:var(--vm);color:#fff}.btn-g{background:#fff;color:var(--vm);border:1.5px solid var(--vm)}.btn-s{padding:6px 10px;font-size:12.5px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border-radius:9px;border:1.5px solid #cbd5e1;background:#fff;font-weight:800;font-size:14px;cursor:pointer;color:var(--gry)}
.seg button.on{background:var(--vm);border-color:var(--vm);color:#fff}.seg button.on.rush{background:var(--red);border-color:var(--red)}
.item{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:8px;margin:8px 0;background:#fff}
.item .th{width:120px;flex:0 0 120px;border:1px solid #eef0f3;border-radius:8px;overflow:hidden;background:#fff}.item .th svg,.item .th img{width:100%;height:auto;display:block}
.item .m{flex:1;min-width:0}.item .t{font-weight:800;font-size:15px}.item .s{font-size:12.5px;color:var(--mut);margin-top:2px}
.item .acts{display:flex;flex-direction:column;gap:4px}
.mark{display:inline-block;background:var(--vm2);color:#fff;border-radius:6px;padding:1px 7px;font-size:12px;margin-right:6px}
.empty{color:var(--mut);font-size:14px;padding:12px 2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px;z-index:40}
.bar .in{max-width:900px;margin:0 auto;display:flex;gap:8px;align-items:center}.bar .in .btn{padding:13px 18px}
.bar .cnt{flex:1;font-size:13px;color:var(--gry);font-weight:700}
.msg{padding:10px;border-radius:9px;font-size:14px;margin:8px 0;display:none}
.msg.ok{background:var(--okbg);color:var(--ok);display:block}.msg.err{background:var(--redbg);color:var(--red);display:block}.msg.info{background:var(--grybg);color:var(--gry);display:block}
.hint{font-size:12px;color:var(--mut);margin-top:3px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:80;padding:10px;overflow:auto}
.modal .box{background:#fff;max-width:760px;margin:0 auto;border-radius:12px;padding:14px}
.modal h2{margin:0 0 6px;font-size:17px;color:var(--vm2);display:flex;justify-content:space-between;align-items:center}
.types .gh{font-size:11.5px;font-weight:800;color:var(--vm2);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 6px}
.types .tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.types button{border:1.5px solid #cbd5e1;background:#fff;border-radius:10px;padding:6px;cursor:pointer;text-align:center;font-weight:700;font-size:12.5px;color:var(--ink)}
.types button svg{width:100%;height:auto;display:block}
.types button:hover{border-color:var(--vm)}
.edgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.edgrid{grid-template-columns:1fr}}
.prev{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;position:sticky;top:6px}
.prev svg{width:100%;height:auto;display:block}
.est{font-size:13px;font-weight:800;color:var(--gry);padding:8px 10px;border-top:1px solid var(--line);background:#fafbfc}
.row-b{display:flex;gap:8px;margin-top:14px}.row-b .btn{flex:1}
.conn{border:1px solid var(--line);border-radius:10px;padding:4px 10px;background:#fafbfc}.conn .cr{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #eef0f3}.conn .cr:last-child{border-bottom:none}.conn .cr span{flex:1;font-size:13.5px;font-weight:700}.conn .cr select{width:58%;padding:7px 8px;font-size:14px}.conn .cr.all span{color:var(--vm2)}
.autoreset{font-size:11.5px;color:var(--vm);cursor:pointer;margin-left:4px;font-weight:700}
canvas.sk{width:100%;height:auto;border:1.5px dashed #9ca3af;border-radius:10px;touch-action:none;background:#fff;display:block}
.gate{position:fixed;inset:0;background:linear-gradient(135deg,var(--vm),var(--vm2));display:flex;align-items:center;justify-content:center;z-index:100;color:#fff;text-align:center;padding:24px}
.gate .box{max-width:340px}.gate img{height:74px;background:#fff;border-radius:12px;padding:8px 12px;margin-bottom:16px}
.gate h1{font-size:22px;margin:0 0 6px}.gate p{opacity:.9;font-size:14px;margin:0 0 20px}
.gate button{background:#fff;color:var(--vm2);border:none;border-radius:10px;padding:13px 22px;font-size:15px;font-weight:700;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.4/lib/msal-browser.min.js"></script>
</head>
<body>
<div id="gate" class="gate"><div class="box">
  <img src="https://img1.wsimg.com/isteam/ip/758c2db3-5548-4484-9c69-07d1b4315f5e/logo%20main%20jpg.jpg/:/rs=h:140,m/qt=q:92" alt="Vision Mechanical">
  <h1>Fitting Ticket</h1><p>Draw up duct &amp; fittings and send them to the shop. Sign in with your Vision Mechanical account.</p>
  <button id="signin">Sign in with Microsoft</button><div id="gateMsg" style="margin-top:14px;font-size:13px"></div>
</div></div>
<header><div class="row">
  <img src="https://img1.wsimg.com/isteam/ip/758c2db3-5548-4484-9c69-07d1b4315f5e/logo%20main%20jpg.jpg/:/rs=h:96,m/qt=q:92" alt="Vision Mechanical">
  <div><h1>Fitting Ticket</h1><div class="who" id="who"></div></div>
</div></header>

<div class="wrap" id="app" style="display:none">
  <div class="msg" id="topMsg"></div>
  <div class="card">
    <h2>1. Ticket</h2>
    <label>Job</label><select id="job"><option value="">Loading jobs…</option></select>
    <div class="g2">
      <div><label>Needed by</label><input type="date" id="need"></div>
      <div><label>Priority</label><div class="seg" id="prio"><button data-v="Normal" class="on">Normal</button><button data-v="Rush" class="rush">Rush</button></div></div>
    </div>
    <label>Deliver to / area</label><input type="text" id="deliver" placeholder="e.g. Level 2 east, or job trailer">
    <label>Notes to the shop</label><textarea id="notes" rows="2" placeholder="Anything that applies to the whole ticket"></textarea>
  </div>

  <div class="card">
    <h2><span>2. Fittings <span id="cnt" style="color:#6b7280;font-weight:700;font-size:13px"></span></span><button class="btn btn-p btn-s" id="addBtn">+ Add fitting</button></h2>
    <div id="items"><div class="empty">Tap <b>+ Add fitting</b>. Pick the type, type the dimensions — it draws it for you.</div></div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<div class="bar" id="bar" style="display:none"><div class="in">
  <div class="cnt" id="barCnt">0 fittings</div>
  <button class="btn btn-p" id="submitBtn">Send to shop</button>
</div></div>

<div class="modal" id="typeModal"><div class="box">
  <h2>Pick a fitting <button class="btn btn-g btn-s" id="tmClose">Close</button></h2>
  <div class="types" id="typeGrid"></div>
</div></div>

<div class="modal" id="edModal"><div class="box">
  <h2><span id="edTitle">Fitting</span><button class="btn btn-g btn-s" id="edType">Change type</button></h2>
  <div class="edgrid">
    <div>
      <div class="g3">
        <div><label>Mark / tag</label><input type="text" id="eMark" placeholder="F-1"></div>
        <div><label>Qty</label><input type="number" id="eQty" inputmode="numeric" min="1" value="1"></div>
        <div><label>Gauge</label><select id="eGa"></select></div>
      </div>
      <div id="eDims"></div>
      <div id="eSketch" style="display:none">
        <label>Sketch it (finger or mouse)</label>
        <canvas class="sk" id="skc" width="700" height="480"></canvas>
        <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><button class="btn btn-g btn-s" id="skUndo">Undo</button><button class="btn btn-g btn-s" id="skClear">Clear</button><label class="btn btn-g btn-s" style="margin:0;color:var(--vm)">&#128247; Photo of a paper sketch<input type="file" id="skPhoto" accept="image/*" style="display:none"></label></div>
        <img id="skImg" style="max-width:100%;margin-top:6px;border-radius:8px;display:none">
        <label>Describe it (sizes, what it connects to)</label><textarea id="skDesc" rows="3"></textarea>
      </div>
      <label>Connections</label><div id="eConn" class="conn"></div>
      <label>Liner</label><select id="eLiner"></select>
      <label>Dimensions are</label><select id="eDimsAre"><option>Sheet metal (outside)</option><option>Inside clear — add liner</option></select>
      <label>Notes for this fitting</label><textarea id="eNotes" rows="2" placeholder="e.g. 2&quot; standing seam, insulate, access door"></textarea>
    </div>
    <div>
      <div class="prev"><div id="ePrev"></div><div class="est" id="eEst"></div></div>
    </div>
  </div>
  <div class="msg" id="edMsg"></div>
  <div class="row-b"><button class="btn btn-g" id="edCancel">Cancel</button><button class="btn btn-p" id="edSave">Save fitting</button></div>
</div></div>

var SK=[], skCur=null, skBg=null;
var cv=E("skc"), cx=cv.getContext("2d");
function skDraw(){ cx.fillStyle="#fff"; cx.fillRect(0,0,cv.width,cv.height); cx.strokeStyle="#e5e7eb"; cx.lineWidth=1; for(var x=0;x<cv.width;x+=35){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,cv.height);cx.stroke();} for(var y=0;y<cv.height;y+=35){cx.beginPath();cx.moveTo(0,y);cx.lineTo(cv.width,y);cx.stroke();}
  if(skBg) cx.drawImage(skBg,0,0,cv.width,cv.height);
  cx.strokeStyle="#111"; cx.lineWidth=3.5; cx.lineCap="round"; cx.lineJoin="round";
  SK.forEach(function(s){ cx.beginPath(); s.forEach(function(p,i){ if(i) cx.lineTo(p[0],p[1]); else cx.moveTo(p[0],p[1]); }); if(s.length===1) cx.lineTo(s[0][0]+0.1,s[0][1]); cx.stroke(); }); }
function skPos(e){ var r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]; }
cv.addEventListener("pointerdown",function(e){ e.preventDefault(); cv.setPointerCapture(e.pointerId); skCur=[skPos(e)]; SK.push(skCur); skDraw(); });
cv.addEventListener("pointermove",function(e){ if(!skCur) return; e.preventDefault(); skCur.push(skPos(e)); skDraw(); });
cv.addEventListener("pointerup",function(){ skCur=null; preview(); });
E("skUndo").onclick=function(){ SK.pop(); skDraw(); preview(); };
E("skClear").onclick=function(){ SK=[]; skBg=null; skDraw(); preview(); };

    '<table style="border-collapse:collapse;font-size:13px;width:100%;margin-top:10px"><tr style="background:#f3f4f6"><th style="padding:6px;border:1px solid #ddd">Mark</th><th style="padding:6px;border:1px solid #ddd">Drawing</th><th style="padding:6px;border:1px solid #ddd;text-align:left">Fitting</th><th style="padding:6px;border:1px solid #ddd">Qty</th><th style="padding:6px;border:1px solid #ddd">Est lb</th></tr>'+rows.join("")+'</table>'+
    '<p style="font-size:12px;color:#6b7280">By gauge: '+gs.map(function(g){return g.phase+" "+(g.phase==="1230"?"duct":"fittings")+" "+g.gauge+" ga ≈ "+Math.round(g.lbs)+" lb ("+g.pcs+" pc)";}).join(" · ")+'. Weights are estimates (+15% seams/waste).</p>'; }
E("submitBtn").onclick=async function(){
  var miss=[]; if(!E("job").value) miss.push("Job"); if(!E("need").value) miss.push("Needed by"); if(!ITEMS.length) miss.push("At least one fitting");
  if(miss.length){ showMsg("msg","err","Still needed: "+miss.join(", ")+"."); E("msg").scrollIntoView({behavior:"smooth",block:"center"}); return; }
  if(!LIST_ID){ showMsg("msg","err","The Fitting Tickets list isn't set up yet — your ticket is saved on this device."); return; }
  if(navigator.onLine===false){ showMsg("msg","err","You're offline — the ticket is saved on this device. Tap Send again with signal."); return; }
  var btn=E("submitBtn"); btn.disabled=true; showMsg("msg","info","Sending…"); E("msg").scrollIntoView({behavior:"smooth",block:"center"});
  try{
    var gs=groupsOf(), tot=0, pcs=0; gs.forEach(function(g){ tot+=g.lbs; pcs+=g.pcs; });
    var jn=E("job").value, jname=E("job").selectedOptions[0].getAttribute("data-name")||"";
    var f={Title:"New ticket | "+jn+" | "+MY_NAME, JobNo:jn, JobName:jname, RequestedBy:MY_NAME, LoginEmail:loginEmail, SubmittedDate:iso(new Date())+"T12:00:00Z", NeededBy:E("need").value+"T12:00:00Z",
      Priority:PRIO, Status:"New", DeliverTo:E("deliver").value.trim(), Notes:E("notes").value.trim(), ItemCount:String(ITEMS.length), PieceCount:String(pcs), EstLbs:String(Math.round(tot)),
      GaugeSummary:gs.map(function(g){return g.phase+" "+g.gauge+"ga "+Math.round(g.lbs)+"lb";}).join(", "),
      Items:JSON.stringify(ITEMS.map(function(it){ var t=ftype(it.type); return {mark:it.mark,type:it.type,name:t.name,d:it.d,qty:it.qty,gauge:it.gauge,conn:it.conn,liner:it.liner,dimsAre:it.dimsAre,notes:it.notes,desc:it.desc||"",phase:t.phase,lbs:Math.round(estLbs(it)*10)/10,line:itemLine(it)}; })),
      StatusLog:new Date().toLocaleString()+" · New · sent by "+MY_NAME };
    Object.keys(f).forEach(function(k){ if(k!=="Title"&&LIST_COLS&&!LIST_COLS[k]) delete f[k]; if(f[k]==="") delete f[k]; });
    var r=CREATED||await gfetch(GRAPH+LIST_ID+"/items",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:f})}); CREATED=r;
    var no="FT-"+String(r.id).padStart(4,"0");
    showMsg("msg","info","Attaching drawings…");
    var html=await buildReport(no), p={Title:no+" | "+jn+" "+jname+" | "+MY_NAME, TicketNo:no, ReportHTML:html};
    Object.keys(p).forEach(function(k){ if(k!=="Title"&&LIST_COLS&&!LIST_COLS[k]) delete p[k]; });
    await gfetch(GRAPH+LIST_ID+"/items/"+r.id+"/fields",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});
    SENT=true; try{ localStorage.removeItem(dkey()); }catch(e){}
    showMsg("msg","ok","Sent to the shop as "+no+". Track it in My Submissions → Fittings.");
    btn.textContent="Sent ✓"; E("barCnt").innerHTML='<a href="" style="color:#c0392b;font-weight:800">Start a new ticket</a>';
  }catch(e){ btn.disabled=false; showMsg("msg","err","Couldn't send ("+(e.message||e)+"). The ticket is saved on this device — try again."); }
};

</script>
<script>
/* ===== Job lists show NAME first, A–Z (e.g. "Epic Phase II · A26103") =====
   Works on any <select> or <datalist> whose options are jobs. Values the page saves are unchanged:
   a picked datalist entry is turned back into "A26103 Epic Phase II" before the page reads it. */
(function(){
  var NO="[A-Z]?\\d{2}[A-Z]?-?\\d{3,}";
  var FWD=new RegExp("^("+NO+")(?:\\s*·\\s*|\\s+)(.+)$"), REV=new RegExp("^(.+?)\\s+·\\s+("+NO+")$");
  function fl(t){ var m=FWD.exec(String(t||"").trim()); return m?{no:m[1],name:m[2].trim()}:null; }
  function cmp(a,b){ return a.k.localeCompare(b.k,undefined,{sensitivity:"base",numeric:true}); }
  function doSelect(sel){
    var opts=Array.prototype.slice.call(sel.options), real=opts.filter(function(o){return o.value!=="";});
    var jobs=real.filter(function(o){ return o.getAttribute("data-vmflip")||fl(o.textContent); });
    if(jobs.length<2||jobs.length<real.length*0.6) return;
    if(jobs.every(function(o){return o.getAttribute("data-vmflip");})) return;
    var v=sel.value;
    jobs.forEach(function(o){ if(o.getAttribute("data-vmflip")) return; if(!o.hasAttribute("value")) o.setAttribute("value",o.textContent); var f=fl(o.textContent); o.textContent=f.name+" · "+f.no; o.setAttribute("data-vmflip","1"); });
    var items=jobs.map(function(o){return {o:o,k:o.textContent.toLowerCase()};}).sort(cmp);
    items.forEach(function(it){ sel.appendChild(it.o); });
    opts.filter(function(o){return jobs.indexOf(o)<0&&o.value!=="";}).forEach(function(o){ sel.appendChild(o); });
    sel.value=v;
  }
  function doList(dl){
    var opts=Array.prototype.slice.call(dl.options), jobs=opts.filter(function(o){ return o.getAttribute("data-vmorig")||fl(o.value); });
    if(jobs.length<2||jobs.length<opts.length*0.6) return;
    if(jobs.every(function(o){return o.getAttribute("data-vmorig");})) return;
    jobs.forEach(function(o){ if(o.getAttribute("data-vmorig")) return; var f=fl(o.value); o.setAttribute("data-vmorig",o.value); o.value=f.name+" · "+f.no; });
    jobs.map(function(o){return {o:o,k:o.value.toLowerCase()};}).sort(cmp).forEach(function(it){ dl.appendChild(it.o); });
  }
  var busy=false;
  function scan(){ if(busy) return; busy=true; try{ document.querySelectorAll("select").forEach(doSelect); document.querySelectorAll("datalist").forEach(doList); }catch(e){} busy=false; }
  function back(e){ var t=e.target; if(!t||t.tagName!=="INPUT"||!t.getAttribute("list")) return; var m=REV.exec(String(t.value||"").trim()); if(m) t.value=m[2]+" "+m[1]; }
  document.addEventListener("input",back,true); document.addEventListener("change",back,true); document.addEventListener("focusout",back,true);
  var tmr=null; new MutationObserver(function(){ if(busy) return; clearTimeout(tmr); tmr=setTimeout(scan,30); }).observe(document.documentElement,{childList:true,subtree:true});
  if(document.readyState!=="loading") scan(); else document.addEventListener("DOMContentLoaded",scan);
  window.vmJobScan=scan;
})();
</script>
